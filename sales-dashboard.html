<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Italdizain — Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --porcelain:#F3F2EE; --surface:#FFFFFF; --ink:#36373B; --onyx:#1C1C1E;
  --copper:#9F6B47; --ash:#8E8E8A; --hair:#E2E0D9; --taupe:#7C6A58; --r:2px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--porcelain); color:var(--ink);
  padding-bottom:calc(24px + env(safe-area-inset-bottom)); font-size:15px; line-height:1.45;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;font-size:inherit}

header{padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
.wordmark{font-size:11px;letter-spacing:.22em;color:var(--onyx);font-weight:600}
.wordmark span{color:var(--copper)}
.hdr-sub{font-size:11px;color:var(--ash);letter-spacing:.04em}
.dhr{height:5px;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);margin:0 16px}

.controls{padding:12px 16px 4px}
.seg{display:flex;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);overflow:hidden}
.seg button{flex:1;padding:9px 0;font-size:13px;font-weight:500;color:var(--ash);border-right:1px solid var(--hair);min-height:38px}
.seg button:last-child{border-right:none}
.seg button.on{color:var(--onyx);font-weight:600;box-shadow:inset 0 -2px 0 var(--copper)}
.row2{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r)}
.stepper .lbl{font-size:14px;font-weight:600;color:var(--onyx);text-align:center;flex:1}
.stepper button{padding:9px 14px;min-height:38px;display:flex;align-items:center}
.stepper button:disabled{opacity:.25}
.divsel{position:relative;display:flex;align-items:center;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r)}
.divsel select{
  -webkit-appearance:none;appearance:none;border:none;background:none;font-family:inherit;
  font-size:13px;font-weight:600;color:var(--copper);padding:9px 26px 9px 12px;min-height:38px;max-width:44vw;
}
.divsel svg{position:absolute;right:9px;pointer-events:none;color:var(--ash)}
svg.ic{display:block}
svg.ic path{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

.kpi{margin:12px 16px 0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:16px}
.kpi .cap{font-size:11px;letter-spacing:.14em;color:var(--ash);text-transform:uppercase}
.kpi .num{font-size:34px;font-weight:700;color:var(--onyx);letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .deltas{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.d-item{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.d-item .tag{font-size:11px;color:var(--ash);font-weight:400}
.up{color:var(--copper)} .down{color:var(--taupe)} .flat{color:var(--ash)}
.kpi .note{font-size:11px;color:var(--ash);margin-top:8px;border-top:1px solid var(--hair);padding-top:8px}

.chartcard{margin:12px 16px 0;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:14px 14px 8px}
.chartcard .cap{font-size:11px;letter-spacing:.14em;color:var(--ash);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.legend{display:flex;gap:12px;font-size:10px;color:var(--ash);text-transform:none;letter-spacing:.02em}
.legend i{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:4px;vertical-align:-1px}
.chartcard svg{width:100%;height:auto;display:block;margin-top:6px}

.tabs{display:flex;margin:16px 16px 0;border-bottom:1px solid var(--hair)}
.tabs button{padding:10px 0;margin-right:22px;font-size:13px;font-weight:600;color:var(--ash);letter-spacing:.06em;text-transform:uppercase;min-height:42px}
.tabs button.on{color:var(--onyx);box-shadow:inset 0 -2px 0 var(--copper)}

.list{margin:0 16px}
.grow{ /* group row */
  display:grid;grid-template-columns:20px 1fr auto;gap:2px 10px;align-items:center;
  padding:13px 2px;border-bottom:1px solid var(--hair);min-height:58px;width:100%;text-align:left;
}
.grow .plus{grid-row:span 2;color:var(--ash);transition:transform .22s ease}
.grow.open .plus{transform:rotate(45deg);color:var(--copper)}
.grow .nm{font-size:14px;font-weight:600;color:var(--onyx)}
.grow .pct{font-size:16px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end;align-items:center;gap:4px}
.grow .bar{grid-column:2;height:3px;background:var(--hair);border-radius:1px;overflow:hidden;margin-top:3px}
.grow .bar i{display:block;height:100%;background:var(--ink)}
.grow .abs{grid-column:3;font-size:11px;color:var(--ash);text-align:right;font-variant-numeric:tabular-nums}
.na{color:var(--ash);font-weight:400;font-size:12px}

.lrow{ /* member row */
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
  padding:11px 2px 11px 30px;border-bottom:1px solid var(--hair);min-height:52px;width:100%;text-align:left;
  background:linear-gradient(to right, transparent 13px, var(--hair) 13px, var(--hair) 14px, transparent 14px);
}
.lrow .nm{font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.lrow .pct{font-size:14px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;display:flex;justify-content:flex-end;align-items:center;gap:4px}
.lrow .abs{grid-column:2;font-size:11px;color:var(--ash);text-align:right;font-variant-numeric:tabular-nums}
.lrow .sh{grid-column:1;height:2px;background:transparent;border-radius:1px;overflow:hidden;margin:3px 0 0}
.lrow .sh i{display:block;height:100%;background:#C9C7C0}
.mut{color:var(--ash)}
.sect{font-size:11px;letter-spacing:.14em;color:var(--ash);text-transform:uppercase;padding:16px 2px 4px}
.emptymsg{padding:24px 2px;font-size:13px;color:var(--ash)}

.detail{position:fixed;inset:0;background:var(--porcelain);z-index:20;transform:translateX(100%);
  transition:transform .32s cubic-bezier(.32,.72,.28,1);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.detail.open{transform:translateX(0)}
.dhead{padding:calc(10px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:4px;
  position:sticky;top:0;background:var(--porcelain);z-index:2}
.dhead .back{display:flex;align-items:center;gap:2px;color:var(--copper);font-size:14px;font-weight:500;padding:8px 8px 8px 4px;min-height:44px}
.dhead .ttl{font-size:16px;font-weight:600;color:var(--onyx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-align:center;padding-right:56px}
.dsub{text-align:center;font-size:11px;color:var(--ash);margin-top:-6px;padding:0 16px 4px}
.detail .lrow{padding-left:2px;background:none}
footer{padding:20px 16px 0;font-size:10px;color:var(--ash);letter-spacing:.03em;line-height:1.6}
.errbox{margin:24px 16px;padding:16px;background:#fff;border:1px solid var(--hair);font-size:13px;color:var(--taupe);border-radius:var(--r)}
</style>
</head>

/* =============================== core model =============================== */
const M = DATA.months, NM = M.length;
const mPos = {}; M.forEach((m,i)=>mPos[m]=i);

  (SB[s][b] || (SB[s][b]=new Float64Array(NM)))[m]+=g;
}

/* ------------------------------- periods --------------------------------- */
const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ym(m){ return [ +m.slice(0,4), +m.slice(5,7) ]; }
function monthLbl(i,withYear){ const [y,mm]=ym(M[i]); return MONTH_NAMES[mm-1]+(withYear?" ’"+String(y).slice(2):""); }
function buildPeriods(gran){
  const out=[]; const idxFrom=mPos["2024-01"];
  if(gran==="M"){ for(let i=idxFrom;i<NM;i++) out.push({label:monthLbl(i,true),months:[i]}); }
  else{
    const buckets={};
    for(let i=idxFrom;i<NM;i++){
      const [y,mm]=ym(M[i]); let key,label;
      if(gran==="Y"){key=y;label=String(y);}
      else if(gran==="H"){const h=mm<=6?1:2;key=y+"H"+h;label="H"+h+" ’"+String(y).slice(2);}
      else{const q=Math.ceil(mm/3);key=y+"Q"+q;label="Q"+q+" ’"+String(y).slice(2);}
      (buckets[key]||(buckets[key]={label,months:[]})).months.push(i);
    }
    for(const k of Object.keys(buckets)) out.push(buckets[k]);
    out.sort((a,b)=>a.months[0]-b.months[0]);
  }
  return out;
}
function matchedPairs(months){
  const cur=[],prev=[];
  for(const i of months){ if(i-12>=0){cur.push(i);prev.push(i-12);} }
  return {cur,prev,full:cur.length===months.length};
}
const sum=(arr,months)=>{let t=0;for(const i of months)t+=arr[i];return t;};
function totalStores(months,storeSet){let t=0;ST.forEach((s,i)=>{if(!storeSet||storeSet.has(i))t+=sum(SM[i],months);});return t;}
function groupTotal(gkey,months,storeSet){let t=0;for(const i of grpStores[gkey]){if(storeSet&&!storeSet.has(i))continue;t+=sum(SM[i],months);}return t;}
function brandTotal(b,months,storeSet){
  if(!storeSet) return sum(BM[b],months);
  let t=0;storeSet.forEach(s=>{const a=SB[s][b];if(a)t+=sum(a,months);});return t;
}

/* ------------------------------ formatting ------------------------------- */
function fmtMoney(v){
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(a>=1e7?1:2).replace(/\.0+$/,"")+"M";
  if(a>=1e3) return Math.round(v/1e3)+"K";
  return String(Math.round(v));
}
function fmtFull(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function deltaPct(cur,prev){ if(prev===0||prev==null) return null; return (cur/prev-1)*100; }
const upArrow ='<svg class="ic" width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5 L9.5 2.5 M4.5 2.5 H9.5 V7.5"/></svg>';
const dnArrow ='<svg class="ic" width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5 L9.5 9.5 M4.5 9.5 H9.5 V4.5"/></svg>';
function deltaHtml(d){
  if(d===null||!isFinite(d)) return '<span class="na">no prior yr</span>';
  const cls=d>0.5?"up":(d<-0.5?"down":"flat");
  const ar=d>0.5?upArrow:(d<-0.5?dnArrow:"");
  return '<span class="'+cls+'" style="display:inline-flex;align-items:center;gap:3px">'+ar+(d>0?"+":"")+d.toFixed(1)+"%</span>";
}
const plusIcon='<svg class="ic plus" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 V13 M3 8 H13"/></svg>';

/* ------------------------------- app state ------------------------------- */
const state={gran:"Y",pi:-1,div:"all",tab:"stores",drill:null,
             open:{stores:new Set(),brands:new Set()}};
let periods=buildPeriods(state.gran);
state.pi=periods.length-1;
function currentCtx(){
  const p=periods[state.pi];
  const cmp=matchedPairs(p.months);
  const set = state.div==="all" ? null : new Set(grpStores[state.div]);
  return {p,cmp,set};
}

    GROUPS.forEach(g=>{const o=document.createElement("option");o.value=g[0];o.textContent=g[1];sel.appendChild(o);});
  }
  sel.value=state.div;
}
function expectedLen(g){return g==="Y"?12:(g==="H"?6:(g==="Q"?3:1));}
function coverageNote(ctx){
  const notes=[]; const p=ctx.p,cmp=ctx.cmp;
  if(!cmp.prev.length) notes.push("No prior-year data for this period (data starts Jul ’23).");
  else if(!cmp.full) notes.push("Growth compared on "+monthLbl(cmp.cur[0],false)+"–"+monthLbl(cmp.cur[cmp.cur.length-1],false)+" (matched months only — data starts Jul ’23).");
  if(p.months.length<expectedLen(state.gran)&&state.gran!=="M") notes.push("Period incomplete: "+p.months.length+" of "+expectedLen(state.gran)+" months to date.");
  return notes.join(" ");
}
function divLabel(){ const g=GROUPS.find(g=>g[0]===state.div); return g?g[1]:"All divisions"; }
function renderKpi(){
  const ctx=currentCtx();
  const cur=totalStores(ctx.p.months,ctx.set);
  const d=ctx.cmp.prev.length?deltaPct(totalStores(ctx.cmp.cur,ctx.set),totalStores(ctx.cmp.prev,ctx.set)):null;
  const note=coverageNote(ctx);
  $("kpiCard").innerHTML='<div class="cap">'+divLabel()+' · gross sales · '+ctx.p.label+"</div>"+
    '<div class="num">₼ '+fmtFull(cur)+"</div>"+
    '<div class="deltas"><span class="d-item">'+deltaHtml(d)+'<span class="tag">vs prior year</span></span></div>'+
    (note?'<div class="note">'+note+"</div>":"");
}

/* Jan–Dec grouped bars: one bar per year, light→dark */
function chartYears(valueFn){
  const W=360,H=132,pad=6,bot=16,gw=(W-2*pad)/12;
  const series=YEARS.map(y=>{
    return Array.from({length:12},(_,k)=>{
      const key=y+"-"+String(k+1).padStart(2,"0");
      return key in mPos ? valueFn(mPos[key]) : null;
    });
  });
  const mx=Math.max(1,...series.flat().filter(v=>v!==null));
  const y=v=>H-bot-(v/mx)*(H-bot-14);
  const bw=Math.min(7,(gw-6)/3);
  let bars="",labels="";
  for(let k=0;k<12;k++){
    const x0=pad+k*gw+(gw-3*bw-2)/2;
    YEARS.forEach((yr,j)=>{
      const v=series[j][k];
      if(v===null) return;
      const bx=x0+j*(bw+1);
      const bh=(H-bot)-y(v);
      bars+='<rect x="'+bx.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh,0.6).toFixed(1)+'" rx="1" fill="'+SHADES[yr]+'"/>';
    });
    labels+='<text x="'+(pad+k*gw+gw/2).toFixed(1)+'" y="'+(H-3)+'" font-size="8.5" fill="#8E8E8A" text-anchor="middle">'+MONTH_NAMES[k][0]+"</text>";
  }
  return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Monthly sales by year">'+
    '<line x1="'+pad+'" y1="'+(H-bot)+'" x2="'+(W-pad)+'" y2="'+(H-bot)+'" stroke="#E2E0D9" stroke-width="1"/>'+
    '<text x="'+pad+'" y="10" font-size="9" fill="#8E8E8A">₼ '+fmtMoney(mx)+"</text>"+bars+labels+"</svg>";
}
const legendHtml='<span class="legend">'+YEARS.map(y=>'<span><i style="background:'+SHADES[y]+'"></i>’'+String(y).slice(2)+"</span>").join("")+"</span>";
function renderChart(){
  const ctx=currentCtx();
  const fn = ctx.set
    ? mi=>{let t=0;ctx.set.forEach(s=>t+=SM[s][mi]);return t;}
    : mi=>{let t=0;for(let s=0;s<NS;s++)t+=SM[s][mi];return t;};
  $("chartCard").innerHTML='<div class="cap"><span>Jan – Dec by year</span>'+legendHtml+"</div>"+chartYears(fn);
}
function renderTabs(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===state.tab));
}

/* -------- grouped lists: segment rows with expanders, %-first members ----- */
function groupRowHtml(gkey,glabel,cur,d,mx,open,count){
  return '<button class="grow'+(open?" open":"")+'" data-grp="'+gkey+'">'+
    plusIcon+
    '<span class="nm">'+glabel+' <span class="na" style="font-size:11px">· '+count+"</span></span>"+
    '<span class="pct">'+deltaHtml(d)+"</span>"+
    '<span class="bar"><i style="width:'+(mx>0?Math.max(2,cur/mx*100).toFixed(1):0)+'%"></i></span>'+
    '<span class="abs">₼ '+fmtMoney(cur)+"</span>"+
  "</button>";
}
function memberRowHtml(kind,idx,name,cur,d,muted,tag){
  return '<button class="lrow" data-k="'+kind+'" data-i="'+idx+'">'+
    '<span class="nm'+(muted?" mut":"")+'">'+name+"</span>"+
    '<span class="pct">'+(tag?'<span class="na">'+tag+"</span>":deltaHtml(d))+"</span>"+
    '<span class="sh"></span>'+
    '<span class="abs">₼ '+fmtMoney(cur)+"</span>"+
  "</button>";
}
function renderList(){
  const ctx=currentCtx();
  const months=ctx.p.months, cmp=ctx.cmp;
  let html="";
  if(state.div!=="all"){
    /* single division: flat lists */
    if(state.tab==="stores"){
      const members=grpStores[state.div].map(si=>({si,cur:sum(SM[si],months)}))
        .filter(m=>m.cur!==0).sort((a,b)=>b.cur-a.cur);
      html=members.length?members.map(m=>{
        const dd=cmp.prev.length?deltaPct(sum(SM[m.si],cmp.cur),sum(SM[m.si],cmp.prev)):null;
        return memberRowHtml("stores",m.si,ST[m.si].n,m.cur,dd,false,null);
      }).join(""):'<div class="emptymsg">No sales in this period.</div>';
    }else{
      const rows=[];
      for(let b=0;b<NB;b++){
        const c=brandTotal(b,months,ctx.set); if(c===0) continue;
        const dd=cmp.prev.length?deltaPct(brandTotal(b,cmp.cur,ctx.set),brandTotal(b,cmp.prev,ctx.set)):null;
        rows.push({b,c,dd});
      }
      rows.sort((a,b)=>b.c-a.c);
      html=rows.length?rows.map(r=>memberRowHtml("brands",r.b,BR[r.b],r.c,r.dd,false,null)).join(""):'<div class="emptymsg">No sales in this period.</div>';
    }
    $("list").innerHTML=html; return;
  }
  /* all divisions: grouped with expanders */
  const openSet=state.open[state.tab];
  if(state.tab==="stores"){
    const gvals=GROUPS.map(g=>groupTotal(g[0],months,null));
    const mx=Math.max(1,...gvals);
    GROUPS.forEach((g,gi)=>{
      const gkey=g[0], cur=gvals[gi];
      const d=cmp.prev.length?deltaPct(groupTotal(gkey,cmp.cur,null),groupTotal(gkey,cmp.prev,null)):null;
      const open=openSet.has(gkey);
      html+=groupRowHtml(gkey,g[1],cur,d,mx,open,grpStores[gkey].length);
      if(open){
        const members=grpStores[gkey].map(si=>({si,cur:sum(SM[si],months)}))
          .filter(m=>m.cur!==0).sort((a,b)=>b.cur-a.cur);
        if(!members.length) html+='<div class="emptymsg" style="padding-left:30px">No sales in this period.</div>';
        members.forEach(m=>{
          const dd=cmp.prev.length?deltaPct(sum(SM[m.si],cmp.cur),sum(SM[m.si],cmp.prev)):null;
          html+=memberRowHtml("stores",m.si,ST[m.si].n,m.cur,dd,false,null);
        });
      }
    });
  }else{
    const gvals=GROUPS.map(g=>grpBrands[g[0]].reduce((t,b)=>t+brandTotal(b,months,null),0));
    const mx=Math.max(1,...gvals);
    GROUPS.forEach((g,gi)=>{
      const gkey=g[0], cur=gvals[gi];
      const dcur=grpBrands[gkey].reduce((t,b)=>t+brandTotal(b,cmp.cur,null),0);
      const dprev=grpBrands[gkey].reduce((t,b)=>t+brandTotal(b,cmp.prev,null),0);
      const d=cmp.prev.length?deltaPct(dcur,dprev):null;
      const open=openSet.has(gkey);
      const members=grpBrands[gkey].map(b=>({b,cur:brandTotal(b,months,null)}))
        .filter(m=>m.cur!==0).sort((a,b)=>b.cur-a.cur);
      html+=groupRowHtml(gkey,g[1],cur,d,mx,open,grpBrands[gkey].length);
      if(open){
        if(!members.length) html+='<div class="emptymsg" style="padding-left:30px">No sales in this period.</div>';
        members.forEach(m=>{
          const dd=cmp.prev.length?deltaPct(brandTotal(m.b,cmp.cur,null),brandTotal(m.b,cmp.prev,null)):null;
          html+=memberRowHtml("brands",m.b,BR[m.b],m.cur,dd,false,null);
        });
      }
    });
  }
  $("list").innerHTML=html;
}

/* ------------------------------- drill-down ------------------------------ */
function renderDetail(){
  const dr=state.drill, panel=$("detail");
  if(!dr){ panel.classList.remove("open"); return; }
  const ctx=currentCtx();
  const isStore=dr.k==="stores";
  const name=isStore?ST[dr.i].n:BR[dr.i];
  $("dTtl").textContent=name;
  $("dSub").textContent=(isStore?"Boutique":"Brand")+" · "+ctx.p.label+(state.div!=="all"?" · "+divLabel():"");
  const valFn=isStore
    ? mi=>SM[dr.i][mi]
    : mi=>{ if(!ctx.set) return BM[dr.i][mi]; let t=0;ctx.set.forEach(s=>{const a=SB[s][dr.i];if(a)t+=a[mi];});return t; };
  const cur=ctx.p.months.reduce((t,m)=>t+valFn(m),0);
  const cm=ctx.cmp.cur.reduce((t,m)=>t+valFn(m),0), pm=ctx.cmp.prev.reduce((t,m)=>t+valFn(m),0);
  const d=ctx.cmp.prev.length?deltaPct(cm,pm):null;
  $("dKpi").innerHTML='<div class="cap">Gross sales · '+ctx.p.label+'</div><div class="num">₼ '+fmtFull(cur)+"</div>"+
    '<div class="deltas"><span class="d-item">'+deltaHtml(d)+'<span class="tag">vs prior year</span></span></div>';
  $("dChart").innerHTML='<div class="cap"><span>Jan – Dec by year</span>'+legendHtml+"</div>"+chartYears(valFn);
  let rows=[];
  if(isStore){
    for(const b in SB[dr.i]){
      const arr=SB[dr.i][b];
      const c=sum(arr,ctx.p.months); if(c===0) continue;
      const dd=ctx.cmp.prev.length?deltaPct(sum(arr,ctx.cmp.cur),sum(arr,ctx.cmp.prev)):null;
      rows.push({kind:"brands",idx:+b,name:BR[+b],cur:c,delta:dd});
    }
  }else{
    ST.forEach((s,si)=>{
      if(ctx.set&&!ctx.set.has(si)) return;
      const arr=SB[si][dr.i]; if(!arr) return;
      const c=sum(arr,ctx.p.months); if(c===0) return;
      const dd=ctx.cmp.prev.length?deltaPct(sum(arr,ctx.cmp.cur),sum(arr,ctx.cmp.prev)):null;
      rows.push({kind:"stores",idx:si,name:s.n,cur:c,delta:dd});
    });
  }
  rows.sort((a,b)=>b.cur-a.cur);
  $("dList").innerHTML='<div class="sect">'+(isStore?"Brands in this boutique":"Doors selling this brand")+"</div>"+
    rows.map(r=>memberRowHtml(r.kind,r.idx,r.name,r.cur,r.delta,false,null)).join("");
  panel.classList.add("open");
  panel.scrollTop=0;
}

/* ------------------------------- top render ------------------------------ */
function renderAll(){
  renderGran();renderStepper();renderDiv();renderKpi();renderChart();renderTabs();renderList();renderDetail();
  $("hdrRange").textContent="2024 – "+M[NM-1].replace("-"," / ");
  $("foot").innerHTML="Includes retail doors plus B2B (projects, distribution and wholesale accounts). Outlet clearances and internal movements excluded. "+
    "Values are gross sales in AZN incl. VAT from the 1C export of 01.07.2023–31.07.2026. "+
    "KARE AF Mall and Aran & KARE are treated as one continuous door. "+
    "Every brand in the file is listed individually ("+NB+" brands); each sits in the division where it earns most, and drill-down shows every door selling it. "+
    "Growth is always against the same months of the prior year.";
}

/* -------------------------------- events --------------------------------- */
function wire(){
  $("granSeg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const cur=periods[state.pi];
    state.gran=b.dataset.g;
    periods=buildPeriods(state.gran);
    const anchor=cur?cur.months[cur.months.length-1]:NM-1;
    state.pi=periods.findIndex(p=>p.months.includes(anchor));
    if(state.pi<0) state.pi=periods.length-1;
    renderAll();
  });
  $("pPrev").addEventListener("click",()=>{ if(state.pi>0){state.pi--;renderAll();} });
  $("pNext").addEventListener("click",()=>{ if(state.pi<periods.length-1){state.pi++;renderAll();} });
  $("divSel").addEventListener("change",e=>{
    state.div=e.target.value; renderAll();
  });
  $("tabs").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    state.tab=b.dataset.t; renderAll();
  });
  $("list").addEventListener("click",e=>{
    const g=e.target.closest("button[data-grp]");
    if(g){
      const set=state.open[state.tab], k=g.dataset.grp;
      set.has(k)?set.delete(k):set.add(k);
      renderList(); return;
    }
    const b=e.target.closest("button[data-k]"); if(!b||b.disabled) return;
    state.drill={k:b.dataset.k,i:+b.dataset.i}; renderDetail();
  });
  $("dList").addEventListener("click",e=>{
    const b=e.target.closest("button[data-k]"); if(!b||b.disabled) return;
    state.drill={k:b.dataset.k,i:+b.dataset.i}; renderDetail();
  });
  $("backBtn").addEventListener("click",()=>{ state.drill=null; renderDetail(); });
}

/* -------------------------------- boot ----------------------------------- */
if(typeof document!=="undefined" && document.getElementById("kpiCard")){
  try{ wire(); renderAll(); }
  catch(err){ document.body.innerHTML='<div class="errbox">The dashboard failed to start: '+String(err&&err.message||err)+"</div>"; }
}
if(typeof module!=="undefined"&&module.exports){
  module.exports={M,ST,BR,GROUPS,SM,BM,SB,grpStores,grpBrands,brandSeg,OTHER,
    buildPeriods,matchedPairs,totalStores,groupTotal,brandTotal,deltaPct,fmtMoney,fmtFull,sum,mPos,state,periods,chartYears:typeof chartYears!=="undefined"?chartYears:null};
}
</script>
</body>
