<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Italdizain — Group Sales</title>
<style>
/* ==========================================================================
   Design Voice — Quiet Future.  Tokens reconciled 2026-08-19 from the built
   Figma masters; values copied from figma/code-handoff/design-voice.css so
   this file stays a single self-contained artifact with no external request.
   ====================================================================== */
:root{
  --dv-cloud:#F3F0E5; --dv-paper:#FDFDFC; --dv-ink:#152A38;
  --dv-poseidon:#255F97; --dv-aqua:#44C5C1; --dv-mist:#E2EBEF;
  --dv-mist-edge:#BECBD1;
  --dv-positive:#2D8B70; --dv-caution:#AF742B; --dv-critical:#A4443C;

  --dv-canvas:var(--dv-cloud); --dv-surface:var(--dv-paper);
  --dv-text:var(--dv-ink); --dv-text-muted:#5B7186;
  --dv-accent:var(--dv-poseidon); --dv-separator:var(--dv-mist);

  /* Glass: three tiers. Dense data wears the strongest plate, never more blur. */
  --dv-glass-section:rgba(253,253,251,.50);
  --dv-glass-dense:rgba(253,253,251,.72);
  --dv-glass-dense-border:rgba(37,95,151,.32);
  --dv-plate:rgba(253,253,251,.55);
  --dv-plate-border:rgba(190,203,209,.55);
  --dv-control:rgba(253,253,251,.72);
  --dv-control-border:rgba(37,95,151,.34);
  --dv-blur-shell:18px; --dv-blur-plate:10px;

  --dv-row-total:rgba(37,95,151,.14);
  --dv-row-detail:rgba(253,253,251,.42);
  --dv-row-hover:rgba(37,95,151,.10);
  --dv-row-press:rgba(37,95,151,.17);

  --dv-radius-section:20px; --dv-radius-shell:18px;
  --dv-radius-plate:14px; --dv-radius-control:18px;
  --dv-s1:4px; --dv-s2:8px; --dv-s3:12px; --dv-s4:16px;
  --dv-s6:24px; --dv-s8:32px; --dv-s10:40px;
  --dv-shadow-card:0 1px 2px rgba(21,42,56,.04), 0 10px 28px rgba(21,42,56,.06);
  --dv-shadow-pressed:0 1px 2px rgba(21,42,56,.10);
  --dv-shadow-over:0 2px 6px rgba(21,42,56,.10), 0 24px 60px rgba(21,42,56,.18);
  --dv-fast:120ms; --dv-standard:180ms; --dv-ease:cubic-bezier(.2,0,0,1);
  --dv-focus:var(--dv-poseidon);

  /* Year ramp — sequential, one hue, light to dark, oldest to newest.
     Validated with the dataviz validator against Paper: adjacent CVD
     ΔE 16.3, normal-vision ΔE 16.8, both clear of the floors. The palest
     step sits under 3:1 on Paper, so the relief rule applies and the chart
     ships a Figures table carrying the same numbers. */
  --yr-2024:#A9C4DC; --yr-2025:#6690C0; --yr-2026:#255F97;
  --dv-grid:var(--dv-separator);
}
@media (prefers-color-scheme:dark){
  :root:not([data-dv-theme="light"]){
    --dv-cloud:#0F1A22; --dv-paper:#17242E; --dv-ink:#E7EDF1;
    --dv-poseidon:#6BA6E8; --dv-aqua:#4FD3CE; --dv-mist:#2A3B48;
    --dv-mist-edge:#3A4C5A;
    --dv-positive:#4FBF9B; --dv-caution:#D9A05B; --dv-critical:#E0776C;
    --dv-text-muted:#9DB0C0;
    --dv-glass-section:rgba(23,36,46,.50);
    --dv-glass-dense:rgba(23,36,46,.78);
    --dv-glass-dense-border:rgba(107,166,232,.28);
    --dv-plate:rgba(231,237,241,.06);
    --dv-plate-border:rgba(107,166,232,.20);
    --dv-control:rgba(231,237,241,.07);
    --dv-control-border:rgba(107,166,232,.30);
    --dv-row-total:rgba(107,166,232,.20);
    --dv-row-detail:rgba(231,237,241,.035);
    --dv-row-hover:rgba(107,166,232,.12);
    --dv-row-press:rgba(107,166,232,.20);
    --dv-shadow-card:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.34);
    --dv-shadow-over:0 2px 8px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.5);
    /* On a dark ground the ramp runs the other way: newest is brightest.
       Validated on #17242E — adjacent CVD ΔE 19.5, normal-vision ΔE 20.1. */
    --yr-2024:#2F5573; --yr-2025:#4E86D9; --yr-2026:#9CC7F2;
  }
}
:root[data-dv-theme="dark"]{
  --dv-cloud:#0F1A22; --dv-paper:#17242E; --dv-ink:#E7EDF1;
  --dv-poseidon:#6BA6E8; --dv-aqua:#4FD3CE; --dv-mist:#2A3B48;
  --dv-mist-edge:#3A4C5A;
  --dv-positive:#4FBF9B; --dv-caution:#D9A05B; --dv-critical:#E0776C;
  --dv-text-muted:#9DB0C0;
  --dv-glass-section:rgba(23,36,46,.50);
  --dv-glass-dense:rgba(23,36,46,.78);
  --dv-glass-dense-border:rgba(107,166,232,.28);
  --dv-plate:rgba(231,237,241,.06);
  --dv-plate-border:rgba(107,166,232,.20);
  --dv-control:rgba(231,237,241,.07);
  --dv-control-border:rgba(107,166,232,.30);
  --dv-row-total:rgba(107,166,232,.20);
  --dv-row-detail:rgba(231,237,241,.035);
  --dv-row-hover:rgba(107,166,232,.12);
  --dv-row-press:rgba(107,166,232,.20);
  --dv-shadow-card:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.34);
  --dv-shadow-over:0 2px 8px rgba(0,0,0,.5), 0 24px 60px rgba(0,0,0,.5);
  --yr-2024:#2F5573; --yr-2025:#4E86D9; --yr-2026:#9CC7F2;
}

/* Hierarchy must survive without transparency, blur, motion or colour. */
@media (prefers-reduced-transparency:reduce){
  :root{
    --dv-glass-section:var(--dv-paper); --dv-glass-dense:var(--dv-paper);
    --dv-plate:var(--dv-paper); --dv-control:var(--dv-paper);
    --dv-blur-shell:0px; --dv-blur-plate:0px;
  }
}
@media (prefers-contrast:more){
  :root{
    --dv-glass-dense-border:var(--dv-poseidon);
    --dv-plate-border:var(--dv-poseidon);
    --dv-control-border:var(--dv-poseidon);
    --dv-text-muted:var(--dv-ink);
    --dv-separator:var(--dv-mist-edge);
  }
}
@media (prefers-reduced-motion:reduce){
  :root{--dv-fast:0ms;--dv-standard:0ms}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ------------------------------------------------------------------ base */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--dv-canvas); color:var(--dv-text);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--dv-s6) + env(safe-area-inset-bottom));
}
button,select,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--dv-focus);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

.wrap{max-width:1440px;margin:0 auto;padding:0 var(--dv-s4)}

/* ---------------------------------------------------------------- header */
header{padding:calc(var(--dv-s4) + env(safe-area-inset-top)) 0 var(--dv-s3);
  display:flex;align-items:center;gap:var(--dv-s3);flex-wrap:wrap}
.wordmark{font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase}
.wordmark b{color:var(--dv-accent);font-weight:700}
.hdr-sub{font-size:11px;color:var(--dv-text-muted);letter-spacing:.03em}
.hdr-spacer{margin-left:auto}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;min-width:36px;padding:0 var(--dv-s3);border-radius:var(--dv-radius-control);
  border:1px solid var(--dv-control-border);background:var(--dv-control);
  font-size:11px;font-weight:700;color:var(--dv-text);
  transition:background var(--dv-standard) var(--dv-ease),
             transform var(--dv-fast) var(--dv-ease),
             box-shadow var(--dv-fast) var(--dv-ease)}
.iconbtn:hover{background:var(--dv-row-hover)}
.iconbtn:active{transform:translateY(1px);box-shadow:var(--dv-shadow-pressed)}
.rule{height:1px;background:var(--dv-separator)}

/* -------------------------------------------------------------- controls */
.controls{padding:var(--dv-s3) 0 0;display:grid;gap:var(--dv-s2)}
.seg{display:flex;background:var(--dv-control);border:1px solid var(--dv-control-border);
  border-radius:var(--dv-radius-control);overflow:hidden;padding:2px;gap:2px}
.seg button{flex:1;padding:8px 0;font-size:12px;font-weight:600;color:var(--dv-text-muted);
  min-height:36px;border-radius:calc(var(--dv-radius-control) - 3px);
  transition:background var(--dv-standard) var(--dv-ease),color var(--dv-standard) var(--dv-ease)}
.seg button:hover{background:var(--dv-row-hover);color:var(--dv-text)}
.seg button:active{transform:translateY(1px)}
.seg button[aria-selected="true"]{background:var(--dv-accent);color:var(--dv-paper);font-weight:700}
.row2{display:flex;gap:var(--dv-s2);align-items:stretch}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;
  background:var(--dv-control);border:1px solid var(--dv-control-border);
  border-radius:var(--dv-radius-control);overflow:hidden}
.stepper .lbl{font-size:13px;font-weight:700;text-align:center;flex:1;
  font-variant-numeric:tabular-nums}
.stepper button{padding:8px 14px;min-height:36px;display:flex;align-items:center;
  transition:background var(--dv-standard) var(--dv-ease)}
.stepper button:hover:not(:disabled){background:var(--dv-row-hover)}
.stepper button:active:not(:disabled){background:var(--dv-row-press);transform:translateY(1px)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.divsel{position:relative;display:flex;align-items:center;background:var(--dv-control);
  border:1px solid var(--dv-control-border);border-radius:var(--dv-radius-control)}
.divsel:hover{background:var(--dv-row-hover)}
.divsel select{-webkit-appearance:none;appearance:none;border:none;background:none;
  font-size:12px;font-weight:700;color:var(--dv-accent);
  padding:8px 28px 8px 14px;min-height:36px;max-width:46vw;cursor:pointer}
.divsel svg{position:absolute;right:10px;pointer-events:none;color:var(--dv-text-muted)}
svg.ic{display:block}
svg.ic path,svg.ic polyline{fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}

/* ------------------------------------------------------------ data plate */
.plate{background:var(--dv-glass-dense);border:1px solid var(--dv-glass-dense-border);
  border-radius:var(--dv-radius-shell);box-shadow:var(--dv-shadow-card)}
.grid{display:grid;gap:var(--dv-s3);margin-top:var(--dv-s3)}

.kpi{padding:var(--dv-s4)}
.kpi .cap{font-size:11px;letter-spacing:.05em;color:var(--dv-accent);
  text-transform:uppercase;font-weight:700}
.kpi .num{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:var(--dv-s1);
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .deltas{display:flex;gap:var(--dv-s4);margin-top:var(--dv-s2);flex-wrap:wrap;
  align-items:center}
.d-item{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums}
.d-item .tag{font-size:11px;color:var(--dv-text-muted);font-weight:400}
/* Direction is glyph + colour, never colour alone. */
.up{color:var(--dv-positive)} .down{color:var(--dv-caution)} .flat{color:var(--dv-text-muted)}
.na{color:var(--dv-text-muted);font-weight:400;font-size:12px}
.kpi .note{font-size:11px;color:var(--dv-text-muted);margin-top:var(--dv-s3);
  border-top:1px solid var(--dv-separator);padding-top:var(--dv-s2);line-height:1.5}

.kpisub{margin-top:var(--dv-s4);border-top:1px solid var(--dv-separator);padding-top:var(--dv-s2)}
.kpisub-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--dv-s3);
  padding:6px 0;font-size:12px;border-bottom:1px solid var(--dv-separator)}
.kpisub-row:last-child{border-bottom:none}
.kpisub-row .k{color:var(--dv-text-muted);white-space:nowrap}
.kpisub-row .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;
  display:inline-flex;align-items:center;gap:6px;min-width:0}

/* ----------------------------------------------------------------- chart */
.chartcard{padding:var(--dv-s4)}
.chartcard .cap{font-size:11px;letter-spacing:.05em;color:var(--dv-accent);
  text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;
  align-items:center;gap:var(--dv-s2);flex-wrap:wrap}
.legend{display:flex;gap:var(--dv-s3);font-size:11px;text-transform:none;
  letter-spacing:.01em;font-weight:400;color:var(--dv-text-muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:5px;vertical-align:-1px}
.plotwrap{position:relative;margin-top:var(--dv-s2)}
.plotwrap svg{width:100%;height:auto;display:block}
.bar-hit{fill:transparent;cursor:pointer}
.bar-hit:focus-visible{outline:2px solid var(--dv-focus);outline-offset:-1px}
.tip{position:absolute;pointer-events:none;z-index:5;padding:8px 10px;
  background:var(--dv-surface);border:1px solid var(--dv-glass-dense-border);
  border-radius:10px;box-shadow:var(--dv-shadow-card);font-size:11px;white-space:nowrap;
  transform:translate(-50%,-115%);opacity:0;transition:opacity var(--dv-fast) var(--dv-ease)}
.tip[data-show="true"]{opacity:1}
.tip b{font-variant-numeric:tabular-nums}
.tip-swatch{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.figbtn{font-size:11px;font-weight:700;color:var(--dv-accent);padding:4px 8px;
  border-radius:8px;min-height:28px;text-transform:none;letter-spacing:0}
.figbtn:hover{background:var(--dv-row-hover)}
.figwrap{margin-top:var(--dv-s3);overflow-x:auto;-webkit-overflow-scrolling:touch}
.figtable{width:100%;border-collapse:collapse;font-size:11px;
  font-variant-numeric:tabular-nums;min-width:520px}
.figtable th,.figtable td{padding:5px 8px;text-align:right;white-space:nowrap;
  height:26px;border-bottom:1px solid var(--dv-separator)}
.figtable th:first-child,.figtable td:first-child{text-align:left}
.figtable thead th{color:var(--dv-accent);font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--dv-mist-edge)}
.figtable tbody tr:hover td{background:var(--dv-row-hover)}
.figtable .yrkey{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* ------------------------------------------------------------------ tabs */
.tabs{display:flex;gap:var(--dv-s6);margin-top:var(--dv-s6);
  border-bottom:1px solid var(--dv-separator)}
.tabs button{padding:10px 0;font-size:12px;font-weight:700;color:var(--dv-text-muted);
  letter-spacing:.06em;text-transform:uppercase;min-height:42px;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color var(--dv-standard) var(--dv-ease)}
.tabs button:hover{color:var(--dv-text)}
.tabs button[aria-selected="true"]{color:var(--dv-accent);border-bottom-color:var(--dv-accent)}

/* ------------------------------------------- list: a scanning instrument */
.list{margin-top:var(--dv-s1)}
.grow{display:grid;grid-template-columns:22px 1fr minmax(96px,auto) minmax(72px,auto);
  gap:2px var(--dv-s3);align-items:center;width:100%;text-align:left;
  padding:12px var(--dv-s2);min-height:58px;border-bottom:1px solid var(--dv-separator);
  border-radius:var(--dv-radius-plate) var(--dv-radius-plate) 0 0;
  transition:background var(--dv-fast) var(--dv-ease)}
.grow:hover{background:var(--dv-row-hover)}
.grow:active{background:var(--dv-row-press)}
.grow[aria-expanded="true"]{background:var(--dv-row-total)}
.grow .plus{grid-row:span 2;color:var(--dv-accent);
  transition:transform var(--dv-standard) var(--dv-ease)}
.grow[aria-expanded="true"] .plus{transform:rotate(45deg)}
.grow .nm{font-size:14px;font-weight:700}
.grow .cnt{color:var(--dv-text-muted);font-size:11px;font-weight:400}
.grow .pct{font-size:14px;font-weight:700;text-align:right;
  display:flex;justify-content:flex-end;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums}
.grow .abs{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.grow .bar{grid-column:2/5;height:3px;background:var(--dv-separator);border-radius:2px;
  overflow:hidden;margin-top:4px}
.grow.wb{grid-template-columns:22px 1fr minmax(76px,auto) minmax(76px,auto) minmax(88px,auto) minmax(96px,auto) minmax(88px,auto)}
.grow.wb .bar{grid-column:2/8}
.grow .bdg,.lrow .bdg{font-size:12px;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--dv-text-muted)}
.grow .vb,.lrow .vb{font-size:13px;font-weight:700;text-align:right;
  display:flex;justify-content:flex-end;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums}
.lrow.wb{grid-template-columns:1fr minmax(76px,auto) minmax(76px,auto) minmax(88px,auto) minmax(96px,auto) minmax(88px,auto)}
.grow .eb,.lrow .eb{font-size:12px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;
  white-space:nowrap}
.grow .eb small,.lrow .eb small{font-size:10px;color:var(--dv-text-muted);font-weight:400}
.grow.nb{grid-template-columns:22px 1fr minmax(76px,auto) minmax(96px,auto) minmax(88px,auto)}
.grow.nb .bar{grid-column:2/6}
.lrow.nb{grid-template-columns:1fr minmax(76px,auto) minmax(96px,auto) minmax(88px,auto)}
.growpl{font-size:10px;font-weight:700;color:var(--dv-accent);border:1px solid var(--dv-control-border);
  border-radius:9px;padding:2px 8px;margin-left:8px;cursor:pointer;background:var(--dv-control)}
.growpl:hover{background:var(--dv-row-hover)}
.listhead.wb{grid-template-columns:22px 1fr minmax(76px,auto) minmax(76px,auto) minmax(88px,auto) minmax(96px,auto) minmax(88px,auto)}
.listhead.wb span:nth-child(n+3){text-align:right}
.listhead.nb{grid-template-columns:22px 1fr minmax(76px,auto) minmax(96px,auto) minmax(88px,auto)}
.listhead.nb span:nth-child(n+3){text-align:right}
.listhead.flat.nb{grid-template-columns:1fr minmax(76px,auto) minmax(96px,auto) minmax(88px,auto)}
.listhead.flat.nb span:nth-child(n+2){text-align:right}
.listhead.flat.wb{grid-template-columns:1fr minmax(76px,auto) minmax(76px,auto) minmax(88px,auto) minmax(96px,auto) minmax(88px,auto)}
.listhead.flat.wb span:nth-child(n+2){text-align:right}
@media (max-width:640px){
  .grow .eb small,.lrow .eb small{display:none}
  .grow.wb{grid-template-columns:22px 1fr minmax(60px,auto) minmax(72px,auto) minmax(72px,auto)}
  .grow.wb .bdg,.grow.wb .pct{display:none}
  .grow.wb .bar{grid-column:2/6}
  .lrow.wb{grid-template-columns:1fr minmax(60px,auto) minmax(72px,auto) minmax(72px,auto)}
  .lrow.wb .bdg,.lrow.wb .pct{display:none}
  .listhead.wb{grid-template-columns:22px 1fr minmax(60px,auto) minmax(72px,auto) minmax(72px,auto)}
  .listhead.wb span:nth-child(4),.listhead.wb span:nth-child(7){display:none}
  .listhead.flat.wb{grid-template-columns:1fr minmax(60px,auto) minmax(72px,auto) minmax(72px,auto)}
  .listhead.flat.wb span:nth-child(3),.listhead.flat.wb span:nth-child(6){display:none}
  .grow.nb{grid-template-columns:22px 1fr minmax(60px,auto) minmax(72px,auto)}
  .grow.nb .pct{display:none}
  .grow.nb .bar{grid-column:2/5}
  .lrow.nb{grid-template-columns:1fr minmax(60px,auto) minmax(72px,auto)}
  .lrow.nb .pct{display:none}
  .listhead.nb{grid-template-columns:22px 1fr minmax(60px,auto) minmax(72px,auto)}
  .listhead.nb span:nth-child(5){display:none}
  .listhead.flat.nb{grid-template-columns:1fr minmax(60px,auto) minmax(72px,auto)}
  .listhead.flat.nb span:nth-child(4){display:none}
  .growpl{display:none}
}
@media (max-width:359px){
  .grow.wb{grid-template-columns:20px 1fr minmax(64px,auto) minmax(64px,auto)}
  .grow.wb .vb{display:none}
  .grow.wb .bar{grid-column:2/5}
  .lrow.wb{grid-template-columns:1fr minmax(64px,auto) minmax(64px,auto)}
  .lrow.wb .vb{display:none}
  .listhead.wb{grid-template-columns:20px 1fr minmax(64px,auto) minmax(64px,auto)}
  .listhead.wb span:nth-child(5){display:none}
  .listhead.flat.wb{grid-template-columns:1fr minmax(64px,auto) minmax(64px,auto)}
  .listhead.flat.wb span:nth-child(4){display:none}
}
.grow .bar i{display:block;height:100%;background:var(--dv-accent);border-radius:2px}

.lrow{display:grid;grid-template-columns:1fr minmax(96px,auto) minmax(72px,auto);
  gap:2px var(--dv-s3);align-items:center;width:100%;text-align:left;
  padding:10px var(--dv-s2) 10px var(--dv-s6);min-height:48px;
  border-bottom:1px solid var(--dv-separator);background:var(--dv-row-detail);
  transition:background var(--dv-fast) var(--dv-ease)}
.lrow:hover{background:var(--dv-row-hover)}
.lrow:active{background:var(--dv-row-press)}
.lrow .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.lrow .pct{font-size:13px;font-weight:700;text-align:right;
  display:flex;justify-content:flex-end;align-items:center;gap:4px;
  font-variant-numeric:tabular-nums}
.lrow .abs{font-size:13px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

.sect{font-size:11px;letter-spacing:.05em;color:var(--dv-accent);text-transform:uppercase;
  font-weight:700;padding:var(--dv-s6) var(--dv-s2) var(--dv-s2)}
.emptymsg{padding:var(--dv-s8) var(--dv-s2);font-size:13px;color:var(--dv-text-muted);
  text-align:center}
.listhead{display:grid;grid-template-columns:22px 1fr minmax(96px,auto) minmax(72px,auto);
  gap:var(--dv-s3);padding:var(--dv-s3) var(--dv-s2) 6px;
  font-size:10px;font-weight:700;color:var(--dv-accent);text-transform:uppercase;
  letter-spacing:.05em;border-bottom:1px solid var(--dv-mist-edge)}
.listhead span:nth-child(3),.listhead span:nth-child(4){text-align:right}
.listhead.flat{grid-template-columns:1fr minmax(96px,auto) minmax(72px,auto);
  padding-left:var(--dv-s6)}
.listhead.flat span:nth-child(2),.listhead.flat span:nth-child(3){text-align:right}

/* ---------------------------------------------------------- P&L statement */
.plwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:var(--dv-s3)}
.pltable{width:100%;border-collapse:collapse;font-size:12px;
  font-variant-numeric:tabular-nums;min-width:640px}
.pltable th,.pltable td{padding:0 10px;height:30px;text-align:right;white-space:nowrap}
.pltable th:first-child,.pltable td:first-child{text-align:left}
.pltable thead th{color:var(--dv-accent);font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--dv-mist-edge)}
.pltable tbody tr{border-bottom:1px solid var(--dv-separator)}
.pltable tbody tr:hover td{background:var(--dv-row-hover)}
.pl-total td{font-weight:700}
.pl-grand td{font-weight:700;background:var(--dv-row-total)}
.pl-child td{color:var(--dv-text-muted);background:var(--dv-row-detail)}
.pl-child td:first-child{padding-left:34px}
.pl-margin td{font-size:11px;color:var(--dv-text-muted);height:24px;border-bottom:none}
.pl-x{display:inline-flex;width:16px;color:var(--dv-accent);font-weight:700}
tr.pl-click{cursor:pointer}
tr.pl-click:focus-visible{outline:2px solid var(--dv-focus);outline-offset:-2px}
.pl-fav{color:var(--dv-positive)} .pl-adv{color:var(--dv-caution)}
.pl-note{font-size:11px;color:var(--dv-text-muted);margin-top:var(--dv-s2);line-height:1.55}
.pl-crumb{display:inline-flex;align-items:center;gap:6px;margin:var(--dv-s3) 0 0;
  padding:7px 14px;border-radius:var(--dv-radius-control);
  border:1px solid var(--dv-control-border);background:var(--dv-control);
  font-size:12px;font-weight:700;color:var(--dv-accent)}
.pl-crumb:hover{background:var(--dv-row-hover)}
/* On a narrow screen the value columns scroll; the line names stay put.
   Sticky cells need OPAQUE paint — the translucent row tints are rebuilt as
   solid mixes over the canvas so nothing shows through while sliding. */
.pltable th:first-child,.pltable td:first-child{position:sticky;left:0;z-index:1;
  background:var(--dv-canvas)}
.pl-grand td:first-child{background:color-mix(in srgb, var(--dv-poseidon) 14%, var(--dv-canvas))}
.pl-child td:first-child{background:color-mix(in srgb, var(--dv-paper) 42%, var(--dv-canvas))}
.pltable tbody tr:hover td:first-child{background:color-mix(in srgb, var(--dv-poseidon) 10%, var(--dv-canvas))}
.detail .pltable th:first-child,.detail .pltable td:first-child{position:static}
/* narrow screens: the line names truncate so at least one figure column is
   always on screen — a statement that opens with no numbers is not a statement */
@media (max-width:640px){
  .pltable th:first-child,.pltable td:first-child{max-width:186px;overflow:hidden;
    text-overflow:ellipsis}
  .pltable th,.pltable td{padding:0 8px}
  .pltable{min-width:520px}
}
.pl-alloc-tag{font-size:10px;color:var(--dv-text-muted);font-weight:400}

/* ------------------------------------------------------------ drill-down */
.scrim{position:fixed;inset:0;background:rgba(21,42,56,.34);z-index:19;opacity:0;
  pointer-events:none;transition:opacity var(--dv-standard) var(--dv-ease)}
.scrim.open{opacity:1;pointer-events:auto}
.detail{position:fixed;inset:0;background:var(--dv-canvas);z-index:20;
  transform:translateX(100%);visibility:hidden;
  transition:transform var(--dv-standard) var(--dv-ease),visibility 0s linear var(--dv-standard);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--dv-s6) + env(safe-area-inset-bottom))}
.detail.open{transform:translateX(0);visibility:visible;transition-delay:0s}
.dhead{padding:calc(var(--dv-s3) + env(safe-area-inset-top)) var(--dv-s4) var(--dv-s2);
  display:flex;align-items:center;gap:var(--dv-s2);position:sticky;top:0;z-index:2;
  background:var(--dv-canvas);border-bottom:1px solid var(--dv-separator)}
.dhead .back{display:flex;align-items:center;gap:4px;color:var(--dv-accent);
  font-size:13px;font-weight:700;padding:8px 10px 8px 6px;min-height:44px;
  border-radius:var(--dv-radius-control);transition:background var(--dv-fast) var(--dv-ease)}
.dhead .back:hover{background:var(--dv-row-hover)}
.dhead .ttl{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;text-align:center;padding-right:64px}
.dsub{text-align:center;font-size:11px;color:var(--dv-text-muted);padding:var(--dv-s2) var(--dv-s4) 0}
.detail .wrap{padding:var(--dv-s3) var(--dv-s4) 0}
.detail .lrow{padding-left:var(--dv-s2)}
.detail .pltable{min-width:0}
/* The drawer is at most 560px wide whatever the viewport is, so the
   width-based two-column rule below must never reach inside it — side by side
   in here squeezes the chart into an unreadable sliver. */
.detail .grid{grid-template-columns:1fr}

footer{padding:var(--dv-s8) 0 var(--dv-s4);font-size:11px;color:var(--dv-text-muted);
  line-height:1.6;border-top:1px solid var(--dv-separator);margin-top:var(--dv-s8)}
footer b{color:var(--dv-text);font-weight:600}
.errbox{margin:var(--dv-s6) var(--dv-s4);padding:var(--dv-s4);background:var(--dv-surface);
  border:1px solid var(--dv-critical);border-top:2px solid var(--dv-critical);
  border-radius:var(--dv-radius-plate);font-size:13px;color:var(--dv-critical)}

/* ------------------------------------------------- responsive: prioritise */
/* 320: nothing shrinks below this; the two summary numbers stack. */
@media (max-width:359px){
  .grow:not(.wb),.listhead:not(.wb){grid-template-columns:20px 1fr minmax(72px,auto)}
  .grow:not(.wb) .pct,.listhead:not(.wb) span:nth-child(4){display:none}
  .grow:not(.wb) .bar{grid-column:2/4}
  .lrow:not(.wb),.listhead.flat:not(.wb){grid-template-columns:1fr minmax(72px,auto)}
  .lrow:not(.wb) .pct,.listhead.flat:not(.wb) span:nth-child(3){display:none}
}
/* 768: the controls stop stacking. */
@media (min-width:768px){
  .wrap{padding:0 var(--dv-s6)}
  .controls{grid-template-columns:minmax(280px,340px) 1fr;align-items:center}
  .row2{margin:0}
  .divsel select{max-width:none}
  .kpi .num{font-size:38px}
}
/* 1024+: evidence sits beside the headline instead of under it. */
@media (min-width:1024px){
  .wrap{padding:0 var(--dv-s10)}
  .grid{grid-template-columns:minmax(320px,4fr) 7fr;gap:var(--dv-s4)}
  /* on desktop the drill-down is a centred modal, wide enough that the
     five-column statement fits with no horizontal scrolling */
  .detail{
    inset:auto; left:50%; top:50%;
    width:min(1240px,94vw); max-height:92vh;
    transform:translate(-50%,-47%); opacity:0;
    border:1px solid var(--dv-glass-dense-border);
    border-radius:var(--dv-radius-shell);
    box-shadow:var(--dv-shadow-over);
    transition:transform var(--dv-standard) var(--dv-ease),
               opacity var(--dv-standard) var(--dv-ease),
               visibility 0s linear var(--dv-standard);
  }
  .detail.open{transform:translate(-50%,-50%);opacity:1}
  .dhead{border-radius:var(--dv-radius-shell) var(--dv-radius-shell) 0 0}
  .lrow{padding-left:var(--dv-s8)}
}
</style>
</head>

/* =============================== core model ===============================
   Unchanged from v3 — the payload shape, the division taxonomy and every
   figure below are the same computations as before. Only the presentation
   layer was rebuilt (Design Voice / Quiet Future).                        */
const M = DATA.months, NM = M.length;
const mPos = {}; M.forEach((m,i)=>mPos[m]=i);
const ST = DATA.stores, BR = DATA.brands, GROUPS = DATA.groups; // [[key,label],...]
const NS = ST.length, NB = BR.length;
const YEARS = [2024,2025,2026];
const YRVAR = {"2024":"var(--yr-2024)","2025":"var(--yr-2025)","2026":"var(--yr-2026)"};

const SM = Array.from({length:NS},()=>new Float64Array(NM));
const BM = Array.from({length:NB},()=>new Float64Array(NM));
const SB = Array.from({length:NS},()=>({}));
const SBn = Array.from({length:NS},()=>({}));  // net sales (ex-VAT) per store x brand
const SBc = Array.from({length:NS},()=>({}));  // product cost per store x brand
const R = DATA.rows;
for(let i=0;i<R.length;i+=6){
  const s=R[i], b=R[i+1], m=R[i+2], g=R[i+3], n=R[i+4], c=R[i+5];
  SM[s][m]+=g; BM[b][m]+=g;
  (SB[s][b]  || (SB[s][b]=new Float64Array(NM)))[m]+=g;
  (SBn[s][b] || (SBn[s][b]=new Float64Array(NM)))[m]+=n;
  (SBc[s][b] || (SBc[s][b]=new Float64Array(NM)))[m]+=c;
}
const grpStores = {}; GROUPS.forEach(g=>grpStores[g[0]]=[]);
ST.forEach((s,i)=>{ (grpStores[s.g] || (grpStores[s.g]=[])).push(i); });
// brand -> dominant division (where it earns most, all-time)
const OTHER = -1; /* every brand is included individually */
const brandSeg = new Array(NB).fill(null);
{
  const acc = Array.from({length:NB},()=>({}));
  ST.forEach((s,si)=>{ for(const b in SB[si]){ let t=0; const a=SB[si][b]; for(let m=0;m<NM;m++)t+=a[m];
    acc[b][s.g]=(acc[b][s.g]||0)+t; }});
  for(let b=0;b<NB;b++){
    let best=null,bv=-1;
    for(const g in acc[b]) if(acc[b][g]>bv){bv=acc[b][g];best=g;}
    brandSeg[b]=best;

}
const grpBrands = {}; GROUPS.forEach(g=>grpBrands[g[0]]=[]);
for(let b=0;b<NB;b++){ if(brandSeg[b]) grpBrands[brandSeg[b]].push(b); }

/* ------------------------------- P&L model -------------------------------
   payload.pnl comes from the finance workbooks via pnl_pipeline.py.
   Boutique statements are finance's own numbers. Brand rows are OURS:
   turnover / net / product cost are real per-brand figures from 1C, and
   every operating-cost line is allocated to brands by the brand's share of
   the boutique's turnover in the selected period (Huseyn's rule, Aug 2026).*/
const PNL = DATA.pnl || null;
const PL_LINES = PNL ? PNL.lines.filter(l=>l.kind!=="h") : [];
const PL_META = {}; if(PNL) PNL.lines.forEach(l=>PL_META[l.id]=l);
const ATOMS = PNL ? PNL.atoms : [];
const atomByCode = {}; ATOMS.forEach(a=>atomByCode[a.code]=a);
const sidIndex = {}; ST.forEach((st,i)=>sidIndex[st.id]=i);
/* statement layout: [total line, [children]] in display order; grand lines alone */
const PL_VIEW = [

  ["cogs",["pc","freight","customs","ins_cogs","cert","coi"]], ["gp",null],

];

/* which P&L period does the globally selected period correspond to? */
function plMode(){
  if(!PNL) return null;
  const p=periods[state.pi], names=p.months.map(i=>M[i]);
  const inH126=names.every(m=>m>="2026-01"&&m<="2026-06");
  if(inH126) return {kind:"m26",idx:names.map(m=>+m.slice(5)-1),label:p.label};
  const inH125=names.every(m=>m>="2025-01"&&m<="2025-06");
  if(inH125) return {kind:"m25",idx:names.map(m=>+m.slice(5)-1),label:p.label};
  if(state.gran==="Y"&&p.label==="2024") return {kind:"y24",label:"2024"};
  if(state.gran==="Y"&&p.label==="2025") return {kind:"y25",label:"2025"};
  if(state.gran==="Y"&&p.label==="2026") return {kind:"y26",label:"2026 · to June"};
  return null;
}
/* one statement line for one atom under a mode -> {a,b,p} (null = no data) */
const asum=(arr,idx)=>idx.reduce((t,i)=>t+arr[i],0);
function plv(atom,lid,mode){
  const L=atom.lines[lid]; if(!L) return {a:null,b:null,p:null};
  switch(mode.kind){
    case "m26": return {a:asum(L.a26,mode.idx), b:asum(L.b26,mode.idx), p:asum(L.p25,mode.idx)};
    case "m25": return {a:asum(L.p25,mode.idx), b:null, p:null};
    case "y24": return {a:L.y24a, b:null, p:null};
    case "y25": return {a:L.y25a, b:L.y25b, p:L.y24a};
    case "y26": return {a:asum(L.a26,[0,1,2,3,4,5]), b:asum(L.b26,[0,1,2,3,4,5]), p:asum(L.p25,[0,1,2,3,4,5])};
  }
}
function plScopeAtoms(){
  return state.div==="all" ? ATOMS : ATOMS.filter(a=>a.div===state.div);
}
/* sid -> its P&L atom (VB1+CC2 and DSTR atoms cover several doors) */
const sidAtom = {}; ATOMS.forEach(a=>a.sids.forEach(sd=>sidAtom[sd]=a));
/* calendar M-indices the budget covers under a mode (for matched actuals) */
function budgetMonths(mode){
  if(!mode) return null;
  const pick=(y,idx)=>idx.map(k=>mPos[y+"-"+String(k+1).padStart(2,"0")]).filter(v=>v!==undefined);
  switch(mode.kind){
    case "m26": return pick("2026",mode.idx);
    case "y26": return pick("2026",[0,1,2,3,4,5]);
    case "y25": return M.map((m,i)=>m.slice(0,4)==="2025"?i:-1).filter(i=>i>=0);
    default: return null;   // 2024 and 2025 sub-year periods carry no budget
  }
}
/* turnover budget for a set of atoms + the lake actual over the SAME months,
   so a July-inclusive period is never compared against a June-ending budget */
function turnoverBudget(atoms, mode){
  if(!PNL||!mode||!atoms.length) return null;
  const bm=budgetMonths(mode); if(!bm||!bm.length) return null;
  let b=null;
  for(const at of atoms){
    const v=plv(at,"gsv",mode); if(v.b!==null) b=(b??0)+v.b;
  }
  if(b===null) return null;
  let act=0;
  for(const at of atoms) for(const sd of at.sids){
    const si=sidIndex[sd]; if(si!==undefined) act+=sum(SM[si],bm);
  }
  /* when the budget window is narrower than the displayed period (Year 2026
     shows July actuals but budgets stop in June), say so */
  const partial = mode.kind==="y26";
  return {b, act, d:deltaPct(act,b), partial};
}
/* per-month budget for the chart: null where finance has no monthly budget */
function monthlyBudgetFn(atoms){
  if(!PNL||!atoms.length) return ()=>null;
  return mi=>{
    const m=M[mi]; if(!(m>="2026-01"&&m<="2026-06")) return null;
    const k=+m.slice(5)-1; let t=null;
    for(const at of atoms){ const v=at.lines.gsv.b26[k]; if(v!==undefined&&v!==null) t=(t??0)+v; }
    return t;
  };
}
/* sum a line over atoms; null-aware (an atom without annual data adds nothing
   but flips `partial` so the UI can say so) */
function plvSum(atoms,lid,mode){
  let a=null,b=null,p=null,partial=false;
  for(const at of atoms){
    const v=plv(at,lid,mode);
    if(v.a===null&&(mode.kind==="y24"||mode.kind==="y25")){partial=true;continue;}
    if(v.a!==null) a=(a??0)+v.a;
    if(v.b!==null) b=(b??0)+v.b;
    if(v.p!==null) p=(p??0)+v.p;
  }
  return {a,b,p,partial};
}
/* calendar month indices (into M) for allocation weights under a mode */
function plWeightMonths(mode){
  const pick=(y,idx)=>idx.map(k=>mPos[y+"-"+String(k+1).padStart(2,"0")]).filter(v=>v!==undefined);
  switch(mode.kind){
    case "m26": return pick("2026",mode.idx);
    case "m25": return pick("2025",mode.idx);
    case "y24": return M.map((m,i)=>m.slice(0,4)==="2024"?i:-1).filter(i=>i>=0);
    case "y25": return M.map((m,i)=>m.slice(0,4)==="2025"?i:-1).filter(i=>i>=0);
    case "y26": return pick("2026",[0,1,2,3,4,5]);
  }
}
/* brand economics across scope atoms: real turnover/net/cost + allocated costs */
function plBrandRows(atoms,mode){
  const mm=plWeightMonths(mode);
  const rows=new Map(); // b -> {g,n,c,alloc:{lid:v}}
  for(const at of atoms){
    const sidxs=at.sids.map(s=>sidIndex[s]).filter(i=>i!==undefined);
    let atomG=0; const perBrand=new Map();
    for(const si of sidxs){
      for(const b in SB[si]){
        const g=asum(SB[si][b],mm);
        const n=SBn[si][b]?asum(SBn[si][b],mm):0, c=SBc[si][b]?asum(SBc[si][b],mm):0;
        if(g===0&&c===0) continue;
        const e=perBrand.get(+b)||{g:0,n:0,c:0}; e.g+=g;e.n+=n;e.c+=c; perBrand.set(+b,e);
        atomG+=g;
      }
    }
    if(atomG===0) continue;
    const lineVals={}; for(const lid of [...OPEX_BLOCKS,"sga",...BELOW_LINES])
      lineVals[lid]=plv(at,lid,mode).a??0;
    for(const [b,e] of perBrand){
      const w=e.g/atomG;
      const r=rows.get(b)||{g:0,n:0,c:0,alloc:{}};
      r.g+=e.g; r.n+=e.n; r.c+=e.c;
      for(const lid in lineVals) r.alloc[lid]=(r.alloc[lid]||0)+w*lineVals[lid];
      rows.set(b,r);
    }
  }
  const out=[];
  for(const [b,r] of rows){
    const gp=r.n-r.c, sga=r.alloc.sga||0;
    const below=BELOW_LINES.reduce((t,l)=>t+(r.alloc[l]||0),0);
    out.push({b,g:r.g,n:r.n,c:r.c,gp,sga,ebitda:gp+sga,np:gp+sga+below,alloc:r.alloc});
  }
  out.sort((x,y)=>y.g-x.g);
  return out;
}

/* ------------------------------ operations -------------------------------
   OPS carries the DSR (traffic/tickets/targets, summed per month) and the
   weekly stock cube (each month holds that month's LAST snapshot — stock is a
   level, so it is read at a point in time, never summed across months).     */
const OPS = DATA.ops || null;
const sidOf = i => ST[i].n && ST[i].id;
function scopeStoreIdx(){
  return state.div==="all" ? ST.map((_,i)=>i) : grpStores[state.div];
}
/* sum a DSR metric over doors x months; null when no door reports it */
function dsrSum(idxs, key, months){
  if(!OPS) return null;
  let t=null;
  for(const i of idxs){
    const rec=OPS.dsr[ST[i].id]; if(!rec) continue;
    for(const m of months){ const v=rec[key][m]; if(v!==null&&v!==undefined) t=(t??0)+v; }
  }
  return t;
}
/* how many doors in scope actually have a DSR file — shown when partial */
function dsrCoverage(idxs){
  if(!OPS) return {have:0,total:idxs.length};
  let have=0; for(const i of idxs) if(OPS.dsr[ST[i].id]) have++;
  return {have,total:idxs.length};
}
/* stock at the end of the selected period, per unique export scope so a
   combined export (all three Swarovski doors) is never counted twice */
function stockAt(idxs, months){
  if(!OPS) return null;
  const scopes=new Set();
  for(const i of idxs){ const k=OPS.stockmap[ST[i].id]; if(k) scopes.add(k); }
  if(!scopes.size) return null;
  let units=0,skus=0,val=null,aged=null,nov=null,week=null,combined=false,notes=[];
  let covered=0;
  for(const k of scopes){
    const S=OPS.stock[k]; if(!S) continue;
    // last month in the selected period for which this scope has a snapshot
    let mi=null;
    for(const m of months) if(S.units[m]!==null&&S.units[m]!==undefined) mi=m;
    if(mi===null) continue;
    covered++;
    units+=S.units[mi]; skus+=S.skus[mi];
    if(S.val[mi]!==null){ val=(val??0)+S.val[mi]; aged=(aged??0)+S.aged[mi]; nov=(nov??0)+S.nov[mi]; }
    const w=S.weeks[String(mi)]; if(w&&(!week||w>week)) week=w;
    if(S.note) notes.push(S.note);
    // a scope covering doors outside this selection means combined figures
    if(S.doors.some(d=>!idxs.some(i=>ST[i].id===d))) combined=true;
  }
  if(!covered) return null;
  const doors=new Set();
  for(const k of scopes){ const S=OPS.stock[k]; if(S) S.doors.forEach(d=>doors.add(d)); }
  return {units,skus,val,aged,nov,week,combined,notes,doors:[...doors],
          agedSh: val?Math.round(aged/val*100):null,
          novSh: val?Math.round(nov/val*100):null,
          scopes:scopes.size};
}
/* weeks of supply: stock units / average weekly units sold in the period */
/* Weeks of supply, measured at COST on both sides.
   Not in units: the stock exports carry packaging and POS consumables in the
   same unit count as the jewellery, which would read as years of cover on a
   high-value door. Stock value / weekly cost of goods sold is the standard
   measure and is unaffected by that mix. Both halves cover the same doors —
   only those the stock export actually includes. */
function weeksOfSupply(stock, idxs, months){
  if(!stock||stock.val===null||!months.length) return null;
  const covered=idxs.filter(i=>stock.doors.includes(ST[i].id));
  if(!covered.length) return null;
  let cogs=0;
  for(const si of covered)
    for(const b in SBc[si]) cogs+=sum(SBc[si][b],months);
  if(cogs<=0) return null;
  const perWeek=cogs/(months.length*4.345);
  return perWeek>0 ? +(stock.val/perWeek).toFixed(1) : null;
}
/* target: only days where a target was actually set are comparable */
function targetPack(idxs, months){
  if(!OPS) return null;
  const t=dsrSum(idxs,"target",months);
  if(!t) return null;
  const act=dsrSum(idxs,"tgt_rev",months);
  const td=dsrSum(idxs,"tgt_days",months), dd=dsrSum(idxs,"days",months);
  return {t, act, d:deltaPct(act,t), cov: dd?Math.round(td/dd*100):null};
}

/* ------------------------------- periods --------------------------------- */
const MONTH_NAMES=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function ym(m){ return [ +m.slice(0,4), +m.slice(5,7) ]; }
function monthLbl(i,withYear){ const [y,mm]=ym(M[i]); return MONTH_NAMES[mm-1]+(withYear?" ’"+String(y).slice(2):""); }
function buildPeriods(gran){
  const out=[]; const idxFrom=mPos["2024-01"];
  if(gran==="M"){ for(let i=idxFrom;i<NM;i++) out.push({label:monthLbl(i,true),months:[i]}); }
  else{
    const buckets={};
    for(let i=idxFrom;i<NM;i++){
      const [y,mm]=ym(M[i]); let key,label;
      if(gran==="Y"){key=y;label=String(y);}
      else if(gran==="H"){const h=mm<=6?1:2;key=y+"H"+h;label="H"+h+" ’"+String(y).slice(2);}
      else{const q=Math.ceil(mm/3);key=y+"Q"+q;label="Q"+q+" ’"+String(y).slice(2);}
      (buckets[key]||(buckets[key]={label,months:[]})).months.push(i);
    }
    for(const k of Object.keys(buckets)) out.push(buckets[k]);
    out.sort((a,b)=>a.months[0]-b.months[0]);
  }
  return out;
}
function matchedPairs(months){
  const cur=[],prev=[];
  for(const i of months){ if(i-12>=0){cur.push(i);prev.push(i-12);} }
  return {cur,prev,full:cur.length===months.length};
}
const sum=(arr,months)=>{let t=0;for(const i of months)t+=arr[i];return t;};
function totalStores(months,storeSet){let t=0;ST.forEach((s,i)=>{if(!storeSet||storeSet.has(i))t+=sum(SM[i],months);});return t;}
function groupTotal(gkey,months,storeSet){let t=0;for(const i of grpStores[gkey]){if(storeSet&&!storeSet.has(i))continue;t+=sum(SM[i],months);}return t;}
function brandTotal(b,months,storeSet){
  if(!storeSet) return sum(BM[b],months);
  let t=0;storeSet.forEach(s=>{const a=SB[s][b];if(a)t+=sum(a,months);});return t;
}

/* ------------------------------ formatting ------------------------------- */
function fmtMoney(v){
  const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(a>=1e7?1:2).replace(/\.0+$/,"")+"M";
  if(a>=1e3) return Math.round(v/1e3)+"K";
  return String(Math.round(v));
}
function fmtFull(v){ return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g," "); }
function deltaPct(cur,prev){ if(prev===0||prev==null) return null; return (cur/prev-1)*100; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const upArrow ='<svg class="ic" width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 9.5 L9.5 2.5 M4.5 2.5 H9.5 V7.5"/></svg>';
const dnArrow ='<svg class="ic" width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5 L9.5 9.5 M4.5 9.5 H9.5 V4.5"/></svg>';
/* Growth carries an arrow as well as a colour — never colour alone. */
function deltaHtml(d){
  if(d===null||!isFinite(d)) return '<span class="na">no prior yr</span>';
  // Anything that rounds to zero is flat, and prints as 0.0% — never "-0.0%".
  const v=Math.abs(d)<0.05?0:d;
  const cls=v>0.5?"up":(v<-0.5?"down":"flat");
  const ar=v>0.5?upArrow:(v<-0.5?dnArrow:"");
  const word=v>0.5?"up":(v<-0.5?"down":"flat");
  return '<span class="'+cls+'" style="display:inline-flex;align-items:center;gap:3px">'+
    ar+'<span class="sr-only">'+word+' </span>'+(v>0?"+":"")+v.toFixed(1)+"%</span>";
}
const plusIcon='<svg class="ic plus" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3 V13 M3 8 H13"/></svg>';

/* ------------------------------- app state ------------------------------- */
const state={gran:"Y",pi:-1,div:"all",tab:"stores",drill:null,figs:false,
             plOpen:new Set(),
             open:{stores:new Set(),brands:new Set()}};

state.pi=periods.length-1;

function expectedLen(g){return g==="Y"?12:(g==="H"?6:(g==="Q"?3:1));}
function coverageNote(ctx){
  const notes=[]; const p=ctx.p,cmp=ctx.cmp;
  if(!cmp.prev.length) notes.push("No prior-year data for this period (data starts Jul ’23).");
  else if(!cmp.full) notes.push("Growth compared on "+monthLbl(cmp.cur[0],false)+"–"+monthLbl(cmp.cur[cmp.cur.length-1],false)+" (matched months only — data starts Jul ’23).");
  if(p.months.length<expectedLen(state.gran)&&state.gran!=="M") notes.push("Period incomplete: "+p.months.length+" of "+expectedLen(state.gran)+" months to date.");
  const md=plMode&&PNL?plMode():null;
  if(md&&md.kind==="y26") notes.push("Budget columns compare January–June — finance budgets are loaded to June.");
  return notes.join(" ");
}
function divLabel(){ const g=GROUPS.find(g=>g[0]===state.div); return g?g[1]:"All divisions"; }
/* Who moved, and by how much. Across divisions when looking at the group;
   across that division's own doors when one is selected. */
function movers(ctx){
  if(!ctx.cmp.prev.length) return [];
  const rows = state.div==="all"
    ? GROUPS.map(g=>({name:g[1],
        cur:groupTotal(g[0],ctx.cmp.cur,null), prev:groupTotal(g[0],ctx.cmp.prev,null)}))
    : grpStores[state.div].map(si=>({name:ST[si].n,
        cur:sum(SM[si],ctx.cmp.cur), prev:sum(SM[si],ctx.cmp.prev)}));
  return rows.filter(r=>r.prev>0&&r.cur>0)
             .map(r=>({name:r.name, d:deltaPct(r.cur,r.prev), abs:r.cur-r.prev}))
             .filter(r=>r.d!==null&&isFinite(r.d))
             .sort((a,b)=>b.d-a.d);
}
/* The operational block: how the turnover was made (traffic -> tickets ->
   basket) and what stock stands behind it. Reused by the KPI card and by the
   drawer, so a boutique and the group read identically. */
function opsBlockHtml(idxs, ctx, opts){
  if(!OPS) return "";
  opts=opts||{};
  const M0=ctx.p.months, cmp=ctx.cmp;
  const cov=dsrCoverage(idxs);
  const traf=dsrSum(idxs,"traffic",M0), tick=dsrSum(idxs,"tickets",M0);
  const units=dsrSum(idxs,"units",M0), rev=dsrSum(idxs,"rev",M0);
  const tour=dsrSum(idxs,"tourists",M0);
  const st=stockAt(idxs,M0);
  if(traf===null&&tick===null&&!st) return "";
  const pv=k=>cmp.prev.length?dsrSum(idxs,k,cmp.prev):null;
  const cv=k=>cmp.prev.length?dsrSum(idxs,k,cmp.cur):null;
  const dOf=k=>{const a=cv(k),b=pv(k); return (a===null||b===null)?null:deltaPct(a,b);};
  const conv=(traf&&tick)?tick/traf*100:null;
  const convL=(pv("traffic")&&pv("tickets"))?pv("tickets")/pv("traffic")*100:null;
  const atv=(tick&&rev)?rev/tick:null;
  const atvL=(pv("tickets")&&pv("rev"))?pv("rev")/pv("tickets"):null;
  const upt=(tick&&units)?units/tick:null;
  const uptL=(pv("tickets")&&pv("units"))?pv("units")/pv("tickets"):null;
  const wos=weeksOfSupply(st,idxs,M0);
  const row=(k,v)=>'<div class="kpisub-row"><span class="k">'+k+'</span><span class="v">'+v+"</span></div>";
  let h='<div class="kpisub">';
  if(traf!==null){
    h+=row("Traffic","<span>"+fmtFull(traf)+"</span> "+deltaHtml(dOf("traffic")));
    if(conv!==null) h+=row("Conversion",'<span>'+conv.toFixed(1)+"%</span>"+
      (convL!==null?' <span class="na">· LY '+convL.toFixed(1)+"%</span>":""));
    if(tour!==null&&traf) h+=row("Tourists",'<span>'+(tour/traf*100).toFixed(1)+"% of traffic</span>");
  }
  if(tick!==null) h+=row("Tickets","<span>"+fmtFull(tick)+"</span> "+deltaHtml(dOf("tickets")));
  if(atv!==null) h+=row("Average ticket",'<span>₼ '+fmtFull(atv)+"</span> "+
    deltaHtml(atvL?deltaPct(atv,atvL):null));
  if(upt!==null) h+=row("Units per ticket",'<span>'+upt.toFixed(2)+"</span> "+
    deltaHtml(uptL?deltaPct(upt,uptL):null));
  if(st){
    h+=row("Stock on hand",'<span>'+fmtFull(st.units)+" units · "+fmtFull(st.skus)+" SKUs</span>"+
      (st.week?' <span class="na">· '+st.week+"</span>":""));
    if(st.val!==null) h+=row("Stock value (at cost)",'<span>₼ '+fmtMoney(st.val)+"</span>"+
      (st.agedSh!==null?' <span class="na">· '+st.agedSh+"% aged &gt;"+OPS.aged_m+"m</span>":""));
    if(st.novSh!==null) h+=row("Novelty (&lt;"+OPS.nov_m+"m)",'<span>'+st.novSh+"% of value</span>");
    if(wos!==null) h+=row("Weeks of supply",'<span>'+wos+"</span>"+
      ' <span class="na">· stock value ÷ weekly cost of sales</span>');
  }
  h+="</div>";
  const notes=[];
  if(cov.have<cov.total) notes.push("Traffic and tickets cover "+cov.have+" of "+cov.total+
    " doors — the rest have no DSR file.");
  if(st&&st.combined) notes.push("Stock export covers doors beyond this selection; the figure is the combined total.");
  if(st&&st.notes&&st.notes.length) notes.push(...st.notes);
  if(!st) notes.push("No weekly stock export for this selection.");
  if(opts.notes===false){
    /* compact form for the KPI card: one line, still never silent about scope */
    const bits=[];
    if(cov.have<cov.total) bits.push("traffic covers "+cov.have+"/"+cov.total+" doors");
    if(st&&st.doors) bits.push("stock covers "+st.doors.filter(d=>idxs.some(i=>ST[i].id===d)).length+
      "/"+idxs.length+" doors"+(st.combined?", combined export":""));
    else bits.push("no stock export in this selection");
    if(bits.length) h+='<div class="note">'+esc(bits.join(" · "))+"</div>";
  }else if(notes.length){
    h+='<div class="note">'+esc(notes.join(" "))+"</div>";
  }
  return h;
}

/* ---------------------------------------------------------------- chart --
   Jan–Dec grouped bars, one bar per year, oldest-to-newest along the
   sequential Poseidon ramp. A transparent hit rect over each bar carries the
   hover/focus tooltip; the same numbers are also available as a table
   (the Figures toggle), which is what discharges the contrast relief rule
   on the palest step of the ramp.                                          */
let TIPDATA=[];
function chartYears(valueFn,idPrefix,budgetFn){
  const W=380,H=150,pad=8,bot=18,top=16,gw=(W-2*pad)/12;
  const series=YEARS.map(y=>Array.from({length:12},(_,k)=>{
      const key=y+"-"+String(k+1).padStart(2,"0");
      return key in mPos ? valueFn(mPos[key]) : null;
    }));
  const buds=Array.from({length:12},(_,k)=>{
    if(!budgetFn) return null;
    const key="2026-"+String(k+1).padStart(2,"0");
    return key in mPos ? budgetFn(mPos[key]) : null;
  });
  const mx=Math.max(1,...series.flat().filter(v=>v!==null),
                    ...buds.filter(v=>v!==null));
  const yOf=v=>H-bot-(Math.max(v,0)/mx)*(H-bot-top);
  const bw=Math.min(8,(gw-6)/3);
  let bars="",labels="",hits="",over="";
  TIPDATA=[];
  for(let k=0;k<12;k++){
    const x0=pad+k*gw+(gw-3*bw-2)/2;
    YEARS.forEach((yr,j)=>{
      const v=series[j][k];
      if(v===null) return;
      const bx=x0+j*(bw+1);
      const by=yOf(v), bh=Math.max((H-bot)-by,0.8);
      bars+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+
        '" height="'+bh.toFixed(1)+'" rx="2" fill="'+YRVAR[yr]+'"/>';
      const b=yr===2026?buds[k]:null;
      let lbl=MONTH_NAMES[k]+" "+yr+": "+fmtFull(v)+" manat";
      if(b!==null){
        const yb=yOf(b);
        /* over budget: the excess above the tick turns positive green;
           under: the shortfall up to the tick is a hollow caution outline.
           The tick itself is the secondary encoding — never colour alone. */
        if(v>=b){
          over+='<rect class="bar-over" x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+
            '" width="'+bw.toFixed(1)+'" height="'+Math.max(yb-by,0.6).toFixed(1)+
            '" rx="1.5" fill="var(--dv-positive)"/>';
        }else{
          over+='<rect class="bar-short" x="'+(bx+0.5).toFixed(1)+'" y="'+yb.toFixed(1)+

function wireChart(root,tipId){
  const tip=root.querySelector("#"+tipId);
  if(!tip) return;
  const snap=TIPDATA.slice();
  const show=e=>{
    const t=e.target.closest("[data-tip]"); if(!t) return;
    const d=snap[+t.dataset.tip]; if(!d) return;
    tip.innerHTML='<i class="tip-swatch" style="background:'+YRVAR[d.yr]+'"></i>'+
      d.mo+" "+d.yr+" · <b>₼ "+fmtFull(d.v)+"</b>"+
      (d.b!=null?'<br>budget ₼ '+fmtFull(d.b)+" · "+deltaHtml(deltaPct(d.v,d.b)):"");
    tip.style.left=d.cx+"%"; tip.style.top=d.cy+"%";
    tip.dataset.show="true";
  };
  const hide=()=>{ tip.dataset.show="false"; };
  root.addEventListener("pointerover",show);
  root.addEventListener("pointerout",hide);
  root.addEventListener("focusin",show);
  root.addEventListener("focusout",hide);
}

function fmtSigned(v){ return (v<0?"-":"")+"₼ "+fmtMoney(Math.abs(v)); }
function varHtml(a,b){
  if(a===null||b===null||b===0) return '<span class="na">—</span>';
  const d=a-b, pct=d/Math.abs(b)*100;
  /* costs are stored negative, so act-bdg>0 is favourable on every line */
  const cls=Math.abs(pct)<0.05?"":(d>0?"pl-fav":"pl-adv");
  return '<span class="'+cls+'">'+(d>0?"+":"")+fmtMoney(d)+' · '+(pct>0?"+":"")+pct.toFixed(1)+"%</span>";
}
function cell(v){ return v===null?'<span class="na">—</span>':fmtSigned(v); }
function plHeaderCols(mode){
  const bdg=!(mode.kind==="m25"||mode.kind==="y24");
  const pri=!(mode.kind==="m25"||mode.kind==="y24");
  return {bdg,pri};
}
function plStatementHtml(atoms,mode,forBrand){
  let {bdg,pri}=plHeaderCols(mode);
  if(forBrand){ bdg=false; pri=false; }
  const rev=forBrand?null:plvSum(atoms,"rev",mode);
  let partial=false;
  let head='<tr><th>'+(forBrand?"Line · allocated at turnover share":"Line")+'</th><th>Actual</th>'+
    (bdg?"<th>Budget</th><th>vs budget</th>":"")+(pri?"<th>Prior yr</th><th>vs prior</th>":"")+"</tr>";
  let body="";
  const row=(lid,vals,cls,label,click)=>{
    const m=PL_META[lid]||{};
    body+='<tr class="'+cls+(click?" pl-click":"")+'"'+(click?' data-plx="'+lid+'" tabindex="0" role="button" aria-expanded="'+state.plOpen.has(lid)+'"':"")+'>'+
      "<td>"+(click?'<span class="pl-x">'+(state.plOpen.has(lid)?"−":"+")+"</span>":'<span class="pl-x"></span>')+
      esc(label||m.label)+"</td>"+
      "<td>"+cell(vals.a)+"</td>"+
      (bdg?"<td>"+cell(vals.b)+"</td><td>"+varHtml(vals.a,vals.b)+"</td>":"")+
      (pri?"<td>"+cell(vals.p)+"</td><td>"+varHtml(vals.a,vals.p)+"</td>":"")+"</tr>";
  };
  const val = forBrand
    ? lid=>({a:forBrand.stmt[lid]??null,b:null,p:null})
    : lid=>{const v=plvSum(atoms,lid,mode); partial=partial||v.partial; return v;};
  const viewRows = forBrand
    ? [["gsv",null],["net",null],["pc",null],["gp",null],
       ...OPEX_BLOCKS.map(l=>[l,null]),["sga",null],["ebitda",null],
       ...BELOW_LINES.map(l=>[l,null]),["np",null]]
    : PL_VIEW;
  for(const [lid,children] of viewRows){
    if(forBrand&&!(lid in forBrand.stmt)) continue;
    const meta=PL_META[lid];
    const vals=val(lid);
    row(lid,vals,meta.kind==="g"?"pl-grand":"pl-total",null,!!children&&!forBrand);
    if(children&&!forBrand&&state.plOpen.has(lid)){
      for(const c of children) row(c,val(c),"pl-child");
    }
    if(MARGIN_AFTER[lid]&&!forBrand&&rev&&rev.a){
      const m=vals.a===null?null:vals.a/rev.a*100;
      const mb=(vals.b!==null&&rev.b)?vals.b/rev.b*100:null;
      body+='<tr class="pl-margin"><td>'+MARGIN_AFTER[lid]+"</td><td>"+(m===null?"—":m.toFixed(1)+"%")+"</td>"+
        (bdg?"<td>"+(mb===null?"—":mb.toFixed(1)+"%")+"</td><td></td>":"")+(pri?"<td></td><td></td>":"")+"</tr>";
    }
  }
  return {html:'<div class="plwrap"><table class="pltable"><thead>'+head+"</thead><tbody>"+body+"</tbody></table></div>",partial};
}

const HEAD_GROUPED=wb=>wb
  ? '<div class="listhead wb"><span></span><span>Division</span>'+
    '<span>Gross</span><span>Budget</span><span>vs budget</span><span>EBITDA</span><span>vs prior yr</span></div>'
  : '<div class="listhead nb"><span></span><span>Division</span>'+

/* budget for one dashboard door: only when the P&L workbook covers exactly
   that door — VB1+CC2 and Distribution budgets exist combined, not per door */
function storeBudget(sid,mode){
  const at=sidAtom[sid];
  if(!at||at.sids.length!==1) return null;
  return turnoverBudget([at],mode);
}
/* actual EBITDA + margin (of total revenue) for one door / a set of atoms */
function storeEb(sid,mode){
  const at=sidAtom[sid];
  if(!at||at.sids.length!==1||!mode) return null;
  const e=plv(at,"ebitda",mode), r=plv(at,"rev",mode);
  if(e.a===null) return null;
  return {v:e.a, m:(r.a?e.a/r.a*100:null)};
}
function atomsEb(atoms,mode){
  if(!mode||!atoms.length) return null;
  const e=plvSum(atoms,"ebitda",mode), r=plvSum(atoms,"rev",mode);
  if(e.a===null) return null;
  return {v:e.a, m:(r.a?e.a/r.a*100:null)};
}
/* allocated per-brand EBITDA for the current scope, one pass per render */
function brandEbMap(mode){
  const map=new Map();
  if(!PNL||!mode) return map;
  for(const r of plBrandRows(plScopeAtoms(),mode))
    map.set(r.b,{v:r.ebitda, m:(r.n?r.ebitda/r.n*100:null)});
  return map;
}
function renderList(){

      const members=grpStores[state.div].map(si=>({si,cur:sum(SM[si],months)}))
        .filter(m=>m.cur!==0).sort((a,b)=>b.cur-a.cur);
      html=members.length?HEAD_FLAT("Boutique",true)+members.map(m=>{
        const dd=cmp.prev.length?deltaPct(sum(SM[m.si],cmp.cur),sum(SM[m.si],cmp.prev)):null;
        return memberRowHtml("stores",m.si,ST[m.si].n,m.cur,dd,
          storeBudget(ST[m.si].id,plmode),storeEb(ST[m.si].id,plmode));
      }).join(""):'<div class="emptymsg">No sales in this period.</div>';
    }else{

        rows.push({b,c,dd});
      }
      rows.sort((a,b)=>b.c-a.c);
      html=rows.length?HEAD_FLAT("Brand")+rows.map(r=>

          .filter(m=>m.cur!==0).sort((a,b)=>b.cur-a.cur);
        if(!members.length) html+='<div class="emptymsg">No sales in this period.</div>';
        members.forEach(m=>{
          const dd=cmp.prev.length?deltaPct(sum(SM[m.si],cmp.cur),sum(SM[m.si],cmp.prev)):null;
          html+=memberRowHtml("stores",m.si,ST[m.si].n,m.cur,dd,
            storeBudget(ST[m.si].id,plmode),storeEb(ST[m.si].id,plmode));
        });
      }
    });
  }else{
    const ebm=brandEbMap(plmode);
    const gvals=GROUPS.map(g=>grpBrands[g[0]].reduce((t,b)=>t+brandTotal(b,months,null),0));
    const mx=Math.max(1,...gvals);
    GROUPS.forEach((g,gi)=>{
      const gkey=g[0], cur=gvals[gi];
      const dcur=grpBrands[gkey].reduce((t,b)=>t+brandTotal(b,cmp.cur,null),0);
      const dprev=grpBrands[gkey].reduce((t,b)=>t+brandTotal(b,cmp.prev,null),0);
      const d=cmp.prev.length?deltaPct(dcur,dprev):null;
      const open=openSet.has(gkey);
      const members=grpBrands[gkey].map(b=>({b,cur:brandTotal(b,months,null)}))
        .filter(m=>m.cur!==0).sort((a,b)=>b.cur-a.cur);
      let geb=null;
      if(ebm.size){
        let v=0,n=0,any=false;
        for(const b of grpBrands[gkey]){const e=ebm.get(b); if(e&&e.v!==null){v+=e.v;any=true;}}

  $("mainList").innerHTML=html;

let lastFocus=null;
function renderDetail(){
  const dr=state.drill, panel=$("detail"), scrim=$("scrim");

    panel.classList.remove("open"); scrim.classList.remove("open");
    panel.setAttribute("aria-hidden","true");

  }

  $("dSub").textContent=(isStore?"Boutique":"Brand")+" · "+ctx.p.label+(state.div!=="all"?" · "+divLabel():"");

    : mi=>{ if(!ctx.set) return BM[dr.i][mi]; let t=0;ctx.set.forEach(s=>{const a=SB[s][dr.i];if(a)t+=a[mi];});return t; };
  const cur=ctx.p.months.reduce((t,m)=>t+valFn(m),0);
  const cm=ctx.cmp.cur.reduce((t,m)=>t+valFn(m),0), pm=ctx.cmp.prev.reduce((t,m)=>t+valFn(m),0);
  const d=ctx.cmp.prev.length?deltaPct(cm,pm):null;
  const mode=plMode();
  const atom=isStore?sidAtom[ST[dr.i].id]:null;
  const single=atom&&atom.sids.length===1;
  const tb=single?turnoverBudget([atom],mode):null;
  $("dKpi").innerHTML='<div class="cap">Gross sales · '+esc(ctx.p.label)+'</div><div class="num">₼ '+fmtFull(cur)+"</div>"+

    (tb?'<span class="d-item">'+deltaHtml(tb.d)+'<span class="tag">vs budget'+(tb.partial?" Jan–Jun":"")+' ₼ '+fmtMoney(tb.b)+"</span></span>":"")+
    "</div>";
  $("dChart").innerHTML=chartCardHtml(valFn,"d",state.figs,single?monthlyBudgetFn([atom]):null);
  wireChart($("dChart"),"dTip");
  /* traffic and stock belong to a door, not to a brand — a brand has no
     door counter and no stock export of its own */
  const opsEl=$("dOps");
  opsEl.hidden=true; opsEl.innerHTML="";
  if(OPS&&isStore){
    const blk=opsBlockHtml([dr.i],ctx,{});
    if(blk){
      opsEl.innerHTML='<div class="cap"><span>Traffic, tickets &amp; stock · '+esc(ctx.p.label)+"</span>"+
        '<span class="note">DSR door counters · weekly 1C stock</span></div>'+blk;
      opsEl.hidden=false;
    }
  }
  /* ---- the P&L, inside the boutique / brand it belongs to ---- */
  const pnlEl=$("dPnl");
  pnlEl.hidden=true; pnlEl.innerHTML="";
  if(PNL&&mode){
    if(isStore&&atom){
      const st=plStatementHtml([atom],mode,null);
      pnlEl.innerHTML='<div class="cap"><span>P&L · '+esc(atom.name)+' · '+esc(mode.label)+"</span></div>"+st.html+
        (atom.sids.length>1?'<div class="pl-note">Finance keeps one P&L for these doors combined ('+esc(atom.name)+").</div>":"")+
        (mode.kind==="y26"?'<div class="pl-note">January–June actuals against the same months of budget. Full-year 2026 revenue budget: ₼ '+fmtMoney(atom.lines.rev.y26b||0)+".</div>":"");
      pnlEl.hidden=false;
    }else if(!isStore){
      const rows=plBrandRows(plScopeAtoms(),mode);
      const r=rows.find(x=>x.b===dr.i);
      if(r){
        const stmt={gsv:r.g, net:r.n, pc:-r.c, gp:r.gp};
        OPEX_BLOCKS.forEach(l=>stmt[l]=r.alloc[l]||0);
        stmt.sga=r.alloc.sga||0; stmt.ebitda=r.ebitda;
        BELOW_LINES.forEach(l=>stmt[l]=r.alloc[l]||0);
        stmt.np=r.np;
        pnlEl.innerHTML='<div class="cap"><span>P&L · allocated · '+esc(mode.label)+"</span></div>"+
          plStatementHtml(plScopeAtoms(),mode,{stmt}).html+
          '<div class="pl-note">Turnover, net sales and product cost are this brand&#39;s real 1C figures across '+
          (state.div==="all"?"the group":esc(divLabel()))+
          "; every other line is allocated by the brand&#39;s share of each boutique&#39;s turnover (rent, salaries and all other costs follow turnover weight). Budgets exist per boutique, not per brand.</div>";
        pnlEl.hidden=false;
      }
    }
  }else if(PNL&&!mode&&isStore&&atom){
    pnlEl.innerHTML='<div class="cap"><span>P&L</span></div>'+
      '<div class="pl-note">No P&L for '+esc(periods[state.pi].label)+
      ". Finance data covers 2024 and 2025 (annual + Jan–Jun monthly) and 2026 to June.</div>";
    pnlEl.hidden=false;
  }
  let rows=[];
  if(isStore){
    /* allocated brand EBITDA *within this boutique* rides on each row */
    const ebm=new Map();
    if(atom&&mode) for(const r of plBrandRows([atom],mode))
      ebm.set(r.b,{v:r.ebitda,m:(r.n?r.ebitda/r.n*100:null)});
    for(const b in SB[dr.i]){
      const arr=SB[dr.i][b];
      const c=sum(arr,ctx.p.months); if(c===0) continue;
      const dd=ctx.cmp.prev.length?deltaPct(sum(arr,ctx.cmp.cur),sum(arr,ctx.cmp.prev)):null;
      rows.push({kind:"brands",idx:+b,name:BR[+b],cur:c,delta:dd,eb:ebm.get(+b)||null});
    }
  }else{
    ST.forEach((s,si)=>{
      if(ctx.set&&!ctx.set.has(si)) return;
      const arr=SB[si][dr.i]; if(!arr) return;
      const c=sum(arr,ctx.p.months); if(c===0) return;
      const dd=ctx.cmp.prev.length?deltaPct(sum(arr,ctx.cmp.cur),sum(arr,ctx.cmp.prev)):null;
      rows.push({kind:"stores",idx:si,name:s.n,cur:c,delta:dd,eb:storeEb(s.id,mode)});
    });
  }
  rows.sort((a,b)=>b.cur-a.cur);
  $("dList").innerHTML='<div class="sect">'+(isStore?"Brands in this boutique":"Doors selling this brand")+"</div>"+
    (rows.length?HEAD_FLAT(isStore?"Brand":"Boutique")+
      rows.map(r=>memberRowHtml(r.kind,r.idx,r.name,r.cur,r.delta,undefined,r.eb)).join("")
     :'<div class="emptymsg">No sales in this period.</div>');
  panel.classList.add("open"); scrim.classList.add("open");
  panel.setAttribute("aria-hidden","false");
  panel.scrollTop=0;
  const first=$("backBtn"); if(first&&first.focus) first.focus();
}


function renderScopeDetail(dr){
  const panel=$("detail"), scrim=$("scrim");
  const ctx=currentCtx();
  const mode=plMode();
  const atoms=dr.g?ATOMS.filter(a=>a.div===dr.g):plScopeAtoms();
  const glabel=dr.g?(GROUPS.find(g=>g[0]===dr.g)||["",dr.g])[1]:divLabel();
  $("dTtl").textContent=glabel+" — P&L";
  $("dSub").textContent=(mode?mode.label:periods[state.pi].label)+" · "+atoms.length+" boutique P&Ls";
  const sidxs=[]; atoms.forEach(a=>a.sids.forEach(sd=>{const si=sidIndex[sd]; if(si!==undefined) sidxs.push(si);}));
  const valFn=mi=>{let t=0;for(const si of sidxs)t+=SM[si][mi];return t;};
  const cur=ctx.p.months.reduce((t,m)=>t+valFn(m),0);
  const cm=ctx.cmp.cur.reduce((t,m)=>t+valFn(m),0), pm=ctx.cmp.prev.reduce((t,m)=>t+valFn(m),0);
  const d=ctx.cmp.prev.length?deltaPct(cm,pm):null;
  const tb=turnoverBudget(atoms,mode);
  const eb=atomsEb(atoms,mode);
  $("dKpi").innerHTML='<div class="cap">Gross sales · '+esc(ctx.p.label)+'</div><div class="num">₼ '+fmtFull(cur)+"</div>"+
    '<div class="deltas"><span class="d-item">'+deltaHtml(d)+'<span class="tag">vs prior year</span></span>'+
    (tb?'<span class="d-item">'+deltaHtml(tb.d)+'<span class="tag">vs budget'+(tb.partial?" Jan–Jun":"")+' ₼ '+fmtMoney(tb.b)+"</span></span>":"")+
    (eb?'<span class="d-item">'+(eb.v<0?"-":"")+"₼ "+fmtMoney(Math.abs(eb.v))+'<span class="tag">EBITDA'+(eb.m!==null?" · "+eb.m.toFixed(1)+"%":"")+"</span></span>":"")+
    "</div>";
  $("dChart").innerHTML=chartCardHtml(valFn,"d",state.figs,monthlyBudgetFn(atoms));
  wireChart($("dChart"),"dTip");
  const opsEl=$("dOps");
  opsEl.hidden=true; opsEl.innerHTML="";
  if(OPS&&sidxs.length){
    const blk=opsBlockHtml(sidxs,ctx,{});
    if(blk){
      opsEl.innerHTML='<div class="cap"><span>Traffic, tickets &amp; stock · '+esc(ctx.p.label)+"</span>"+
        '<span class="note">DSR door counters · weekly 1C stock</span></div>'+blk;
      opsEl.hidden=false;
    }
  }
  const pnlEl=$("dPnl");
  if(mode&&atoms.length){
    const st=plStatementHtml(atoms,mode,null);
    pnlEl.innerHTML='<div class="cap"><span>P&L · '+esc(glabel)+' · '+esc(mode.label)+"</span></div>"+st.html+
      (st.partial?'<div class="pl-note">Carpets has no annual P&L workbook — annual periods exclude it.</div>':"")+
      (mode.kind==="y26"?'<div class="pl-note">January–June actuals against the same months of budget. Full-year 2026 revenue budget: ₼ '+
        fmtMoney(atoms.reduce((t,a)=>t+((a.lines.rev&&a.lines.rev.y26b)||0),0))+".</div>":"");
    pnlEl.hidden=false;
  }else{
    pnlEl.innerHTML='<div class="cap"><span>P&L</span></div>'+
      '<div class="pl-note">No P&L for '+esc(periods[state.pi].label)+
      ". Finance data covers 2024 and 2025 (annual + Jan–Jun monthly) and 2026 to June.</div>";
    pnlEl.hidden=false;
  }
  const rows=atoms.map(a=>{
    const si=a.sids.length===1?sidIndex[a.sids[0]]:undefined;
    const months=ctx.p.months;
    const rcur=a.sids.reduce((t,sd)=>{const i=sidIndex[sd];return t+(i!==undefined?sum(SM[i],months):0);},0);
    const dd=ctx.cmp.prev.length?deltaPct(
      a.sids.reduce((t,sd)=>{const i=sidIndex[sd];return t+(i!==undefined?sum(SM[i],ctx.cmp.cur):0);},0),
      a.sids.reduce((t,sd)=>{const i=sidIndex[sd];return t+(i!==undefined?sum(SM[i],ctx.cmp.prev):0);},0)):null;
    return {a,si,cur:rcur,dd,eb:mode?atomsEb([a],mode):null};
  }).sort((x,y)=>y.cur-x.cur);
  $("dList").innerHTML='<div class="sect">Boutiques in '+esc(glabel)+"</div>"+HEAD_FLAT("Boutique")+
    rows.map(r=>r.si!==undefined
      ?memberRowHtml("stores",r.si,r.a.name,r.cur,r.dd,undefined,r.eb)
      :'<div class="lrow nb"><span class="nm">'+esc(r.a.name)+'</span><span class="abs">₼ '+fmtMoney(r.cur)+"</span>"+
        ebCell(r.eb)+'<span class="pct">'+deltaHtml(r.dd)+"</span></div>").join("");
  panel.classList.add("open"); scrim.classList.add("open");
  panel.setAttribute("aria-hidden","false"); panel.scrollTop=0;
  const first=$("backBtn"); if(first&&first.focus) first.focus();
}

/* ------------------------------- top render ------------------------------ */
function renderAll(){
  renderGran();renderStepper();renderDiv();renderKpi();renderChart();renderTabs();renderList();renderDetail();
  const lastM=ym(M[NM-1]);
  $("hdrRange").textContent="Jan 2024 – "+MONTH_NAMES[lastM[1]-1]+" "+lastM[0]+" · gross sales, AZN";
  $("foot").innerHTML="<b>Scope.</b> Retail doors plus B2B (projects, distribution and wholesale accounts). "+
    "Outlet clearances, internal movements and write-offs are excluded. "+
    "Values are gross sales in AZN including VAT, from the 1C export of 01.07.2023–31.07.2026. "+
    "<b>Doors.</b> KARE AF Mall and Aran & KARE are treated as one continuous door. "+
    "<b>Brands.</b> Every brand in the file is listed individually ("+NB+"); each sits in the division "+
    "where it earns most, and drill-down shows every door selling it. "+
    "<b>Growth.</b> Always against the same months of the prior year. "+
    (OPS?"<b>Traffic and tickets</b> come from the boutique DSR files (door counters); "+
      "targets count only the days a target was set. <b>Stock</b> is the last weekly 1C "+
      "snapshot inside the selected period, valued at each item's average cost; aged = first "+
      "seen over "+OPS.aged_m+" months earlier.":"");
}

/* --------------------------------- theme --------------------------------- */
const THEMES=["auto","light","dark"];
function applyTheme(t){
  if(t==="auto") document.documentElement.removeAttribute("data-dv-theme");
  else document.documentElement.setAttribute("data-dv-theme",t);
  const l=$("themeLbl"); if(l) l.textContent=t.charAt(0).toUpperCase()+t.slice(1);
}
let themeIdx=0;

/* -------------------------------- events --------------------------------- */
function wire(){
  $("granSeg").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const cur=periods[state.pi];
    state.gran=b.dataset.g;
    periods=buildPeriods(state.gran);
    const anchor=cur?cur.months[cur.months.length-1]:NM-1;
    state.pi=periods.findIndex(p=>p.months.includes(anchor));
    if(state.pi<0) state.pi=periods.length-1;
    renderAll();
  });
  $("pPrev").addEventListener("click",()=>{ if(state.pi>0){state.pi--;renderAll();} });
  $("pNext").addEventListener("click",()=>{ if(state.pi<periods.length-1){state.pi++;renderAll();} });
  $("divSel").addEventListener("change",e=>{ state.div=e.target.value; renderAll(); });
  $("tabs").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    state.tab=b.dataset.t; renderAll();
  });
  $("themeBtn").addEventListener("click",()=>{
    themeIdx=(themeIdx+1)%THEMES.length; applyTheme(THEMES[themeIdx]);
  });
  const figToggle=e=>{
    const f=e.target.closest("[data-figs]"); if(!f) return true;
    state.figs=!state.figs;
    if(state.drill) renderDetail(); else renderChart();
    return false;
  };
  $("chartCard").addEventListener("click",figToggle);
  $("dChart").addEventListener("click",figToggle);
  $("mainList").addEventListener("click",e=>{
    const pl=e.target.closest("[data-divpl]");
    if(pl){
      e.stopPropagation(); lastFocus=pl;
      state.drill={k:"scope",g:pl.dataset.divpl}; renderDetail(); return;
    }
    const g=e.target.closest("[data-grp]");
    if(g){
      const set=state.open[state.tab], k=g.dataset.grp;
      set.has(k)?set.delete(k):set.add(k);
      renderList(); return;
    }
    const b=e.target.closest("button[data-k]"); if(!b||b.disabled) return;
    lastFocus=b;
    state.drill={k:b.dataset.k,i:+b.dataset.i}; renderDetail();
  });
  $("mainList").addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const g=e.target.closest('[data-grp][role="button"]');
    if(g){ e.preventDefault(); g.click(); }
  });
  $("dList").addEventListener("click",e=>{
    const b=e.target.closest("button[data-k]"); if(!b||b.disabled) return;
    state.drill={k:b.dataset.k,i:+b.dataset.i}; renderDetail();
  });
  $("backBtn").addEventListener("click",()=>{ state.drill=null; renderDetail(); });
  $("scrim").addEventListener("click",()=>{ state.drill=null; renderDetail(); });
  /* statement block expanders live inside the drawer now */
  $("detail").addEventListener("click",e=>{
    const x=e.target.closest("tr[data-plx]");
    if(x){ const k=x.dataset.plx;
      state.plOpen.has(k)?state.plOpen.delete(k):state.plOpen.add(k);
      if(state.drill) renderDetail(); }
  });
  $("detail").addEventListener("keydown",e=>{
    if(e.key!=="Enter"&&e.key!==" ") return;
    const t=e.target.closest("tr[data-plx]");
    if(t){ e.preventDefault(); t.click(); }
  });
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&state.drill){ state.drill=null; renderDetail(); return; }
    if(state.drill) return;
    const tag=(e.target.tagName||"").toLowerCase();
    if(tag==="select"||tag==="input") return;
    if(e.key==="ArrowLeft"&&state.pi>0){ state.pi--; renderAll(); }
    else if(e.key==="ArrowRight"&&state.pi<periods.length-1){ state.pi++; renderAll(); }
  });
}

/* -------------------------------- boot ----------------------------------- */
if(typeof document!=="undefined" && document.getElementById("kpiCard")){
  try{ wire(); renderAll(); }
  catch(err){ document.body.innerHTML='<div class="errbox"><b>The dashboard failed to start.</b><br>'+
    esc(String(err&&err.message||err))+"</div>"; }
}
if(typeof module!=="undefined"&&module.exports){
  module.exports={M,ST,BR,GROUPS,SM,BM,SB,SBn,SBc,grpStores,grpBrands,brandSeg,OTHER,
    buildPeriods,matchedPairs,totalStores,groupTotal,brandTotal,deltaPct,fmtMoney,fmtFull,sum,mPos,state,periods,
    PNL,ATOMS,atomByCode,plv,plvSum,plMode,plBrandRows,plScopeAtoms,plWeightMonths,
    OPEX_BLOCKS,BELOW_LINES,PL_VIEW,
    OPS,dsrSum,dsrCoverage,stockAt,weeksOfSupply,targetPack,scopeStoreIdx,currentCtx,
    chartYears:typeof chartYears!=="undefined"?chartYears:null};
}
</script>
